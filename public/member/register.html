<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join KUPPET — Member Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260724i">
  <link rel="stylesheet" href="/css/portal.css?v=20260724i">
  <style>
    .pw-wrap { position: relative; }
    .pw-wrap .form-control { padding-right: 2.6rem; }
    .pw-toggle {
      position: absolute; top: 0; right: 0; height: 100%; width: 2.6rem;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 0;
    }
    .pw-toggle:hover { color: var(--primary); }
  </style>
</head>
<body class="portal-body member-register-page">
<div style="min-height:100vh;background:linear-gradient(135deg,#00641C 0%,#008B23 55%,#1FB24A 100%);display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem">

<div style="background:#fff;border-radius:24px;width:100%;max-width:680px;padding:2.5rem;box-shadow:0 20px 40px rgba(0,0,0,0.2);margin:auto">

  <!-- Header -->
  <div style="text-align:center;margin-bottom:2rem">
    <div class="login-logo-icon"><img src="/images/kuppetlogo.png" class="logo-img" alt="KUPPET"></div>
    <h1 style="font-size:1.4rem;font-weight:800;margin:0 0 0.3rem">Join KUPPET Migori</h1>
    <p style="margin:0;font-size:0.85rem;color:var(--text-muted)">Complete the form below to apply for membership. Admin approval required.</p>
  </div>

  <!-- Step indicator -->
  <div class="step-indicator" id="step-indicator">
    <div class="step-item active" data-step="1"><div class="step-num"><span>1</span></div><div class="step-label">Personal Info</div></div>
    <div class="step-item" data-step="2"><div class="step-num"><span>2</span></div><div class="step-label">Employment</div></div>
  </div>

  <div id="reg-alert" class="hidden" style="margin-bottom:1rem"></div>

  <form id="reg-form">

    <!-- Step 1: Personal Info -->
    <div class="step-panel active" id="panel-1">
      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" name="full_name" class="form-control" placeholder="As per National ID" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Gender <span class="required">*</span></label>
          <select name="gender" class="form-control" required>
            <option value="">Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date of Birth <span class="required">*</span></label>
          <input type="date" name="date_of_birth" class="form-control" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Phone Number <span class="required">*</span></label>
          <input type="tel" name="phone" class="form-control" placeholder="+254 7XX XXX XXX" required>
        </div>
        <div class="form-group">
          <label>Email Address <span class="required">*</span></label>
          <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Password <span class="required">*</span></label>
          <div class="pw-wrap">
            <input type="password" name="password" class="form-control" placeholder="Min 8 chars, incl. a letter & a number" required minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}">
            <button type="button" class="pw-toggle" aria-label="Show password"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password <span class="required">*</span></label>
          <div class="pw-wrap">
            <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
            <button type="button" class="pw-toggle" aria-label="Show password"><i class="fas fa-eye"></i></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Step 2: Employment -->
    <div class="step-panel" id="panel-2">
      <div class="form-row">
        <div class="form-group">
          <label>TSC Number <span class="required">*</span></label>
          <input type="text" name="tsc_number" class="form-control" placeholder="e.g. 00123456" required>
        </div>
        <div class="form-group">
          <label>National ID Number <span class="required">*</span></label>
          <input type="text" name="national_id" class="form-control" placeholder="e.g. 12345678" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Employment Number</label>
          <input type="text" name="employment_number" class="form-control" placeholder="Optional">
        </div>
        <div class="form-group">
          <label>Job Group <span class="required">*</span></label>
          <select name="job_group" class="form-control" required>
            <option value="">Select job group</option>
            <option value="B5">B5</option>
            <option value="C1">C1</option>
            <option value="C2">C2</option>
            <option value="C3">C3</option>
            <option value="C4">C4</option>
            <option value="C5">C5</option>
            <option value="D1">D1</option>
            <option value="D2">D2</option>
            <option value="D3">D3</option>
            <option value="D4">D4</option>
            <option value="D5">D5</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>School Name <span class="required">*</span></label>
        <input type="text" name="school_name" class="form-control" placeholder="Name of your school" required>
      </div>
      <div class="form-group">
        <label>Sub-County <span class="required">*</span></label>
        <select name="sub_county" class="form-control" required>
          <option value="">Select sub-county</option>
          <option>Rongo</option>
          <option>Awendo</option>
          <option>Uriri</option>
          <option>Suna East</option>
          <option>Suna West</option>
          <option>Ntimaru</option>
          <option>Kuria West</option>
          <option>Kuria East</option>
          <option>Mabera</option>
          <option>Nyatike South</option>
          <option>Nyatike West</option>
          <option>Nyatike North</option>
        </select>
      </div>
      <div class="form-group">
        <label>Category <span class="required">*</span></label>
        <select name="school_category" class="form-control" required>
          <option value="">Select category</option>
          <option value="senior_school">Senior School</option>
          <option value="junior_school">Junior School</option>
          <option value="tertiary_school">Tertiary School</option>
        </select>
      </div>
    </div>

  </form>

  <!-- Navigation buttons -->
  <div style="display:flex;justify-content:space-between;margin-top:1.5rem">
    <button id="btn-prev" class="btn btn-outline btn-sm" style="visibility:hidden"><i class="fas fa-arrow-left"></i> Previous</button>
    <button id="btn-next" class="btn btn-gold btn-sm">Next <i class="fas fa-arrow-right"></i></button>
    <button id="btn-submit" class="btn btn-primary btn-sm" style="display:none"><i class="fas fa-paper-plane"></i> Submit Application</button>
  </div>

  <div style="text-align:center;margin-top:1.25rem;font-size:0.8rem;color:var(--text-muted)">
    Already registered? <a href="/member/login.html" style="color:var(--primary);font-weight:600">Sign in here</a>
  </div>

</div>
</div>

<script src="/member/js/member-api.js?v=20260724i"></script>
<script>
  // Show/hide password toggles
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = btn.previousElementSibling;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      btn.querySelector('i').className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
    });
  });

  let currentStep = 1;
  const totalSteps = 2;

  function updateStepUI() {
    for (let i = 1; i <= totalSteps; i++) {
      const panel = document.getElementById(`panel-${i}`);
      const item = document.querySelector(`[data-step="${i}"]`);
      panel.classList.toggle('active', i === currentStep);
      item.classList.remove('active','done');
      if (i === currentStep) item.classList.add('active');
      else if (i < currentStep) item.classList.add('done');
    }
    document.getElementById('btn-prev').style.visibility = currentStep === 1 ? 'hidden' : 'visible';
    document.getElementById('btn-next').style.display = currentStep < totalSteps ? '' : 'none';
    document.getElementById('btn-submit').style.display = currentStep === totalSteps ? '' : 'none';
  }

  function validateStep(step) {
    const panel = document.getElementById(`panel-${step}`);
    const inputs = panel.querySelectorAll('[required]');
    for (const inp of inputs) {
      if (!inp.value.trim()) {
        inp.focus();
        showReg('Please fill in all required fields', 'danger');
        return false;
      }
    }
    if (step === 1) {
      const pw = panel.querySelector('[name=password]').value;
      const cpw = panel.querySelector('[name=confirm_password]').value;
      // Mirror the server rule (memberAuth.js): ≥8 chars incl. a letter AND a number.
      if (!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(pw)) {
        showReg('Password must be at least 8 characters and include a letter and a number', 'danger');
        return false;
      }
      if (pw !== cpw) { showReg('Passwords do not match', 'danger'); return false; }
    }
    return true;
  }

  function showReg(msg, type = 'danger') {
    const el = document.getElementById('reg-alert');
    el.className = `alert alert-${type}`;
    el.textContent = msg;
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.getElementById('btn-next').addEventListener('click', () => {
    if (!validateStep(currentStep)) return;
    document.getElementById('reg-alert').className = 'hidden';
    currentStep++;
    updateStepUI();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.getElementById('btn-prev').addEventListener('click', () => {
    currentStep--;
    updateStepUI();
  });

  document.getElementById('btn-submit').addEventListener('click', async () => {
    if (!validateStep(totalSteps)) return;
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting…';

    const form = document.getElementById('reg-form');
    const data = new FormData(form);
    data.delete('confirm_password');

    try {
      const res = await memberApi.auth.register(data);
      document.getElementById('reg-alert').className = 'hidden';
      document.querySelector('[id^=panel]').closest('form').style.display = 'none';
      document.getElementById('step-indicator').style.display = 'none';
      document.querySelectorAll('#btn-prev,#btn-next,#btn-submit').forEach(b => b.style.display = 'none');
      showReg(res.message || 'Application submitted successfully! You will receive a notification once reviewed.', 'success');
    } catch (err) {
      if (err.code === 'ACCOUNT_EXISTS') {
        showReg((err.message || 'You already have an account.') + ' Redirecting to login…', 'success');
        const tsc = (document.querySelector('[name="tsc_number"]')?.value || '').trim();
        setTimeout(() => { window.location.href = '/member/login.html?tsc=' + encodeURIComponent(tsc); }, 2000);
        return;
      }
      showReg(err.message || 'Registration failed. Please try again.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Application';
    }
  });
</script>
</body>
</html>
