<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — KUPPET Migori</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260721a">
  <link rel="stylesheet" href="/css/portal.css?v=20260721a">
</head>
<body class="portal-body portal-login-page member-login-page">

<div class="portal-login-card">
  <div class="login-logo">
    <div class="login-logo-icon"><img src="/images/kuppetlogo.png" class="logo-img" alt="KUPPET"></div>
    <h1>Set New Password</h1>
    <p>KUPPET Migori Branch</p>
  </div>

  <div id="rp-alert" class="hidden"></div>

  <div id="rp-form">
    <div class="form-group">
      <label for="password">New Password</label>
      <div style="position:relative">
        <input type="password" id="password" class="form-control" placeholder="Minimum 8 characters" autocomplete="new-password" style="padding-right:2.5rem">
        <button type="button" id="toggle-pw" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label for="confirm">Confirm New Password</label>
      <input type="password" id="confirm" class="form-control" placeholder="Repeat password" autocomplete="new-password">
    </div>

    <button id="rp-btn" class="btn btn-primary" style="width:100%;margin-top:0.5rem">
      <i class="fas fa-key"></i> Reset Password
    </button>
  </div>

  <div style="text-align:center;margin-top:1.25rem">
    <a href="/member/login.html" style="font-size:0.82rem;color:var(--primary);font-weight:600"><i class="fas fa-arrow-left"></i> Back to login</a>
  </div>
</div>

<script src="/member/js/member-api.js?v=20260721a"></script>
<script>
  const token = new URLSearchParams(window.location.search).get('token');
  const pwEl = document.getElementById('password');
  const confirmEl = document.getElementById('confirm');
  const btn = document.getElementById('rp-btn');
  const alertEl = document.getElementById('rp-alert');

  if (!token) {
    document.getElementById('rp-form').style.display = 'none';
    alertEl.className = 'alert alert-danger';
    alertEl.innerHTML = 'Invalid reset link. Please <a href="/member/forgot-password.html">request a new one</a>.';
  }

  document.getElementById('toggle-pw').addEventListener('click', () => {
    const t = pwEl.type === 'password' ? 'text' : 'password';
    pwEl.type = t;
    document.querySelector('#toggle-pw i').className = t === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
  });

  async function submit() {
    alertEl.className = 'hidden';
    if (pwEl.value.length < 8) {
      alertEl.className = 'alert alert-danger'; alertEl.textContent = 'Password must be at least 8 characters.'; return;
    }
    if (pwEl.value !== confirmEl.value) {
      alertEl.className = 'alert alert-danger'; alertEl.textContent = 'Passwords do not match.'; return;
    }
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting…';
    try {
      const res = await memberApi.auth.resetPassword(token, pwEl.value);
      document.getElementById('rp-form').style.display = 'none';
      alertEl.className = 'alert alert-success';
      alertEl.innerHTML = (res.message || 'Password reset successful.') + ' <a href="/member/login.html">Log in</a>.';
      setTimeout(() => { window.location.href = '/member/login.html'; }, 2500);
    } catch (err) {
      alertEl.className = 'alert alert-danger';
      alertEl.textContent = err.message || 'Could not reset password. The link may have expired.';
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-key"></i> Reset Password';
    }
  }

  btn.addEventListener('click', submit);
  confirmEl.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
