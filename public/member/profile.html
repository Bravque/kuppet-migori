<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=sessionStorage.getItem("memberToken"),la=parseInt(sessionStorage.getItem("memberLastActivity")||"0",10);if(!t||(la&&Date.now()-la>1800000)){sessionStorage.removeItem("memberToken");sessionStorage.removeItem("memberUser");sessionStorage.removeItem("memberLastActivity");location.replace("/member/login.html");}})();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — KUPPET Migori</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260804b"><link rel="stylesheet" href="/css/portal.css?v=20260804b">
</head>
<body class="portal-body member-profile-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1>My Profile</h1><p>Manage your membership information</p></div>
      </div>
      <div id="profile-msg" class="hidden"></div>
      <div id="onboarding-banner" class="alert alert-warning hidden" style="margin-bottom:1.25rem">
        <strong><i class="fas fa-circle-info"></i> Complete your profile to continue.</strong>
        <span id="onboarding-missing"></span>
      </div>

      <!-- Photo + membership info -->
      <div class="data-card" style="margin-bottom:1.25rem">
        <div style="padding:1.5rem;display:flex;gap:1.5rem;align-items:flex-start;flex-wrap:wrap">
          <div style="text-align:center">
            <div class="profile-avatar" id="profile-photo"><i class="fas fa-user" style="font-size:2rem"></i></div>
            <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" style="display:none">
            <button class="btn btn-outline btn-xs" style="margin-top:0.75rem;display:block" onclick="document.getElementById('photo-input').click()">
              <i class="fas fa-camera"></i> Change Photo
            </button>
          </div>
          <div>
            <div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Member Number</div>
            <div style="font-size:1.1rem;font-weight:800;margin-bottom:0.5rem" id="p-member-number">—</div>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
              <span id="p-status"></span>
              <span style="font-size:0.78rem;color:var(--text-muted)">Since <span id="p-joined">—</span></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Editable fields -->
      <div class="data-card" style="margin-bottom:1.25rem">
        <div class="data-card-header"><div class="data-card-title">Personal Information</div></div>
        <div style="padding:1.25rem">
          <div class="form-row">
            <div class="form-group"><label>Full Name</label><input type="text" id="p-full-name" class="form-control" disabled></div>
            <div class="form-group"><label>Email</label><input type="email" id="p-email" class="form-control"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Phone Number</label><input type="tel" id="p-phone" class="form-control"></div>
            <div class="form-group"><label>Gender</label>
              <select id="p-gender" class="form-control">
                <option value="">Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Date of Birth</label><input type="date" id="p-date-of-birth" class="form-control"></div>
            <div class="form-group"><label>National ID</label><input type="text" id="p-national-id" class="form-control" disabled></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>TSC Number</label><input type="text" id="p-tsc-number" class="form-control" disabled></div>
            <div class="form-group"><label>Employment Number</label><input type="text" id="p-employment-number" class="form-control"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>School Name</label><input type="text" id="p-school-name" class="form-control" data-school-picker autocomplete="off"><small style="color:var(--text-muted);font-size:0.75rem">Select from the list. If your school isn't listed, contact the office.</small></div>
            <div class="form-group"><label>Sub-County</label>
              <select id="p-sub-county" class="form-control">
                <option>Rongo</option><option>Awendo</option><option>Uriri</option><option>Suna East</option><option>Suna West</option><option>Ntimaru</option><option>Kuria West</option><option>Kuria East</option><option>Mabera</option><option>Nyatike South</option><option>Nyatike West</option><option>Nyatike North</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Category</label>
              <select id="p-school-category" class="form-control">
                <option value="">Select category</option>
                <option value="senior_school">Senior School</option>
                <option value="junior_school">Junior School</option>
                <option value="tertiary_school">Tertiary School</option>
              </select>
            </div>
            <div class="form-group">
              <label>Job Group</label>
              <select id="p-job-group" class="form-control">
                <option value="">Select job group</option>
                <option value="B5">B5</option>
                <option value="C1">C1</option>
                <option value="C2">C2</option>
                <option value="C3">C3</option>
                <option value="C4">C4</option>
                <option value="C5">C5</option>
                <option value="D1">D1</option>
                <option value="D2">D2</option>
                <option value="D3">D3</option>
                <option value="D4">D4</option>
                <option value="D5">D5</option>
              </select>
            </div>
            <div class="form-group" style="grid-column:1/-1">
              <label>Person With Disability?</label>
              <div style="display:flex;gap:1.5rem;margin-top:.35rem">
                <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer">
                  <input type="radio" name="p-has-disability" value="1" style="width:auto;margin:0"> Yes
                </label>
                <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer">
                  <input type="radio" name="p-has-disability" value="0" style="width:auto;margin:0"> No
                </label>
              </div>
            </div>
            <div class="form-group hidden" id="p-disability-desc-group" style="grid-column:1/-1">
              <label>Please describe your disability</label>
              <textarea id="p-disability-description" class="form-control" rows="3" placeholder="Describe the nature of your disability" maxlength="1000"></textarea>
            </div>
          </div>
          <!-- Save result shows here, right beside the button that was pressed —
               #profile-msg at the top of the page is off-screen on a phone. -->
          <div id="profile-save-msg" class="hidden"></div>
          <button id="btn-save-profile" class="btn btn-gold btn-sm"><i class="fas fa-save"></i> Save Changes</button>
        </div>
      </div>

      <!-- Change password -->
      <div class="data-card">
        <div class="data-card-header"><div class="data-card-title">Change Password</div></div>
        <div style="padding:1.25rem">
          <div id="pw-msg" class="hidden"></div>
          <div class="form-row">
            <div class="form-group"><label>Current Password</label><input type="password" id="old-pw" class="form-control"></div>
            <div class="form-group"><label>New Password (min 8 chars)</label><input type="password" id="new-pw" class="form-control"></div>
          </div>
          <button id="btn-change-pw" class="btn btn-outline btn-sm"><i class="fas fa-key"></i> Update Password</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/member/js/member-api.js?v=20260804b"></script><script src="/js/school-picker.js?v=20260804b"></script><script src="/member/js/member-portal.js?v=20260804b"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getMemberSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getMemberTopbarHtml('My Profile');
</script>
</body>
</html>
