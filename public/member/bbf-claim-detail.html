<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=sessionStorage.getItem("memberToken"),la=parseInt(sessionStorage.getItem("memberLastActivity")||"0",10);if(!t||(la&&Date.now()-la>1800000)){sessionStorage.removeItem("memberToken");sessionStorage.removeItem("memberUser");sessionStorage.removeItem("memberLastActivity");location.replace("/member/login.html");}})();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBF Claim Detail — KUPPET Migori</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260725j"><link rel="stylesheet" href="/css/portal.css?v=20260725j">
</head>
<body class="portal-body member-bbf-detail-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1 id="claim-number">BBF Claim</h1></div>
        <div class="page-heading-actions">
          <a href="/member/bbf-claims.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> All Claims</a>
          <button id="btn-edit-claim" class="btn btn-outline btn-sm" style="display:none"><i class="fas fa-pen"></i> Edit Details</button>
          <button id="btn-submit-claim" class="btn btn-gold btn-sm" style="display:none"><i class="fas fa-paper-plane"></i> Submit for Review</button>
        </div>
      </div>
      <div id="detail-msg" class="hidden"></div>

      <div class="grid-2" style="gap:1rem">
        <!-- Claim info -->
        <div>
          <div class="data-card" style="margin-bottom:1rem">
            <div class="data-card-header"><div class="data-card-title">Claim Details</div></div>
            <div style="padding:1.25rem" id="claim-details"></div>
          </div>

          <!-- Documents -->
          <div class="data-card">
            <div class="data-card-header">
              <div class="data-card-title">Required Documents</div>
            </div>
            <div style="padding:1.25rem">
              <div id="doc-msg" class="hidden" style="margin-bottom:0.75rem"></div>
              <div id="doc-slots"></div>
            </div>
          </div>
        </div>

        <!-- Timeline -->
        <div class="data-card">
          <div class="data-card-header"><div class="data-card-title">Status Timeline</div></div>
          <div style="padding:1.25rem">
            <div class="timeline" id="timeline"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Edit draft claim modal -->
<div class="portal-modal-overlay" id="edit-claim-modal">
  <div class="portal-modal">
    <div class="portal-modal-header"><h3>Edit Claim Details</h3><button class="modal-close-btn"><i class="fas fa-times"></i></button></div>
    <div class="portal-modal-body">
      <div id="edit-claim-msg" class="hidden"></div>
      <form id="edit-claim-form">
        <div class="form-group">
          <label>Claim Type <span class="required">*</span></label>
          <select id="edit-claim-type" class="form-control" required>
            <option value="death">Death</option>
            <option value="retirement">Retirement</option>
          </select>
        </div>
        <div id="edit-death-only-fields">
          <div class="form-group">
            <label>Name of Deceased <span class="required">*</span></label>
            <input type="text" id="edit-claim-name" class="form-control" placeholder="Full name of the deceased">
          </div>
          <div class="form-group">
            <label>Relationship with Deceased <span class="required">*</span></label>
            <input type="text" id="edit-claim-relationship" class="form-control" placeholder="e.g. Spouse, Child, Parent">
          </div>
          <div class="form-group">
            <label>Date of Death <span class="required">*</span></label>
            <input type="date" id="edit-claim-dod" class="form-control">
          </div>
        </div>
        <div style="padding:0.75rem;background:var(--bg);border-radius:8px;font-size:0.8rem;color:var(--text-muted)">
          <i class="fas fa-info-circle" style="color:var(--primary)"></i>
          Changing the claim type may change which supporting documents are required before you can submit.
        </div>
      </form>
    </div>
    <div class="portal-modal-footer">
      <button class="modal-close-btn btn btn-outline btn-sm">Cancel</button>
      <button id="btn-save-claim" class="btn btn-gold btn-sm"><i class="fas fa-save"></i> Save Changes</button>
    </div>
  </div>
</div>

<script src="/member/js/member-api.js?v=20260725j"></script><script src="/member/js/member-portal.js?v=20260725j"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getMemberSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getMemberTopbarHtml('Claim Detail');
</script>
</body>
</html>
