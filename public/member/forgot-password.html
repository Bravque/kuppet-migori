<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — KUPPET Migori</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260724c">
  <link rel="stylesheet" href="/css/portal.css?v=20260724c">
</head>
<body class="portal-body portal-login-page member-login-page">

<div class="portal-login-card">
  <div class="login-logo">
    <div class="login-logo-icon"><img src="/images/kuppetlogo.png" class="logo-img" alt="KUPPET"></div>
    <h1>Reset Password</h1>
    <p>KUPPET Migori Branch</p>
  </div>

  <div id="fp-alert" class="hidden"></div>

  <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:1rem">
    Enter your TSC number (or the email on your account) and we'll send a password reset link to your email.
  </p>

  <div class="form-group">
    <label for="identifier">TSC Number or Email</label>
    <input type="text" id="identifier" class="form-control" placeholder="e.g. 00123456" autocomplete="username">
  </div>

  <button id="fp-btn" class="btn btn-primary" style="width:100%;margin-top:0.5rem">
    <i class="fas fa-paper-plane"></i> Send Reset Link
  </button>

  <div style="text-align:center;margin-top:1.25rem">
    <a href="/member/login.html" style="font-size:0.82rem;color:var(--primary);font-weight:600"><i class="fas fa-arrow-left"></i> Back to login</a>
  </div>
</div>

<script src="/member/js/member-api.js?v=20260724c"></script>
<script>
  const idEl = document.getElementById('identifier');
  const btn = document.getElementById('fp-btn');
  const alertEl = document.getElementById('fp-alert');

  async function submit() {
    if (!idEl.value.trim()) {
      alertEl.className = 'alert alert-danger';
      alertEl.textContent = 'Please enter your TSC number or email.';
      return;
    }
    alertEl.className = 'hidden';
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending…';
    try {
      const res = await memberApi.auth.forgotPassword(idEl.value.trim());
      alertEl.className = 'alert alert-success';
      alertEl.textContent = res.message || 'If an account matches, a reset link has been sent.';
      idEl.value = '';
    } catch (err) {
      alertEl.className = 'alert alert-danger';
      alertEl.textContent = err.message || 'Could not process your request. Please try again.';
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
    }
  }

  btn.addEventListener('click', submit);
  idEl.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
