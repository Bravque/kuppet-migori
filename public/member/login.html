<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login — KUPPET Migori</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260714c">
  <link rel="stylesheet" href="/css/portal.css?v=20260714c">
</head>
<body class="portal-body portal-login-page member-login-page">

<div class="portal-login-card">
  <div class="login-logo">
    <div class="login-logo-icon"><img src="/images/kuppetlogo.png" class="logo-img" alt="KUPPET"></div>
    <h1>Member Portal</h1>
    <p>KUPPET Migori Branch</p>
  </div>

  <div id="login-alert" class="hidden"></div>

  <div class="form-group">
    <label for="tsc-number">TSC Number</label>
    <input type="text" id="tsc-number" class="form-control" placeholder="e.g. 00123456" autocomplete="username">
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <div style="position:relative">
      <input type="password" id="password" class="form-control" placeholder="Enter password" autocomplete="current-password" style="padding-right:2.5rem">
      <button type="button" id="toggle-pw" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer">
        <i class="fas fa-eye"></i>
      </button>
    </div>
  </div>

  <div style="text-align:right;margin-top:-0.25rem;margin-bottom:0.75rem">
    <a href="/member/forgot-password.html" style="font-size:0.8rem;color:var(--primary);font-weight:600">Forgot password?</a>
  </div>

  <button id="login-btn" class="btn btn-primary" style="width:100%;margin-top:0.5rem">
    <i class="fas fa-sign-in-alt"></i> Sign In
  </button>

  <div style="text-align:center;margin-top:1.25rem;font-size:0.82rem;color:var(--text-muted)">
    Not registered yet?
    <a href="/member/register.html" style="color:var(--primary);font-weight:600">Register here</a>
  </div>
  <div style="text-align:center;margin-top:0.75rem">
    <a href="/" style="font-size:0.78rem;color:var(--text-muted)"><i class="fas fa-arrow-left"></i> Back to website</a>
  </div>
</div>

<script src="/member/js/member-api.js"></script>
<script>
  if (sessionStorage.getItem('memberToken')) {
    window.location.href = '/member/dashboard.html';
  }

  const tscEl = document.getElementById('tsc-number');
  const passwordEl = document.getElementById('password');

  // Prefill the TSC number if we arrived here from a "you already have an account" redirect.
  const tscParam = new URLSearchParams(window.location.search).get('tsc');
  if (tscParam) { tscEl.value = tscParam; setTimeout(() => passwordEl.focus(), 0); }
  const loginBtn = document.getElementById('login-btn');
  const alertEl = document.getElementById('login-alert');

  document.getElementById('toggle-pw').addEventListener('click', () => {
    const t = passwordEl.type === 'password' ? 'text' : 'password';
    passwordEl.type = t;
    document.querySelector('#toggle-pw i').className = t === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
  });

  async function doLogin() {
    alertEl.className = 'hidden';
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in…';
    try {
      const res = await memberApi.auth.login(tscEl.value.trim(), passwordEl.value);
      memberApi.saveToken(res.token);
      memberApi.saveMember(res.member);
      // Bulk-imported members must set a real password, then complete their
      // profile, before reaching the portal.
      if (res.must_change_password) {
        window.location.href = '/member/first-login.html';
      } else if (res.onboarding_complete === false) {
        window.location.href = '/member/profile.html';
      } else {
        window.location.href = '/member/dashboard.html';
      }
    } catch (err) {
      alertEl.className = 'alert alert-danger';
      alertEl.textContent = err.message || 'Login failed';
    } finally {
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
    }
  }

  loginBtn.addEventListener('click', doLogin);
  tscEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  passwordEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
