<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=sessionStorage.getItem("memberToken"),la=parseInt(sessionStorage.getItem("memberLastActivity")||"0",10);if(!t||(la&&Date.now()-la>1800000)){sessionStorage.removeItem("memberToken");sessionStorage.removeItem("memberUser");sessionStorage.removeItem("memberLastActivity");location.replace("/member/login.html");}})();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarships — KUPPET Migori</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260713a"><link rel="stylesheet" href="/css/portal.css?v=20260713a">
</head>
<body class="portal-body member-scholarships-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1>Available Scholarships</h1><p>Browse and apply for scholarship opportunities.</p></div>
        <a href="/member/scholarship-applications.html" class="btn btn-outline btn-sm"><i class="fas fa-list"></i> My Applications</a>
      </div>
      <div id="sch-msg" class="hidden" style="margin-bottom:1rem"></div>
      <div id="scholarships-list"></div>
    </div>
  </main>
</div>
<div class="portal-modal-overlay" id="apply-modal">
  <div class="portal-modal" style="max-width:600px">
    <div class="portal-modal-header"><h3>Apply: <span id="apply-scholarship-title"></span></h3><button class="modal-close-btn"><i class="fas fa-times"></i></button></div>
    <div class="portal-modal-body">
      <div id="apply-msg" class="hidden"></div>
      <form id="apply-form">
        <!-- Applicant details — pulled from the member's profile, not re-entered -->
        <div style="padding:0.85rem 1rem;background:var(--bg);border-radius:8px;margin-bottom:1rem">
          <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:0.5rem"><i class="fas fa-id-badge" style="color:var(--primary)"></i> Your details (from your profile)</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.4rem 1rem;font-size:0.82rem">
            <div><span style="color:var(--text-muted)">Name:</span> <strong id="sa-name">—</strong></div>
            <div><span style="color:var(--text-muted)">Member No:</span> <strong id="sa-memberno">—</strong></div>
            <div><span style="color:var(--text-muted)">TSC No:</span> <strong id="sa-tsc">—</strong></div>
            <div><span style="color:var(--text-muted)">Phone:</span> <strong id="sa-phone">—</strong></div>
            <div><span style="color:var(--text-muted)">Email:</span> <strong id="sa-email">—</strong></div>
            <div><span style="color:var(--text-muted)">Sub-County:</span> <strong id="sa-subcounty">—</strong></div>
            <div><span style="color:var(--text-muted)">School:</span> <strong id="sa-school">—</strong></div>
            <div><span style="color:var(--text-muted)">Category:</span> <strong id="sa-category">—</strong></div>
          </div>
          <div style="font-size:0.72rem;color:var(--text-muted);margin-top:0.5rem">Need to change these? Update your <a href="/member/profile.html">profile</a>.</div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Institution <span class="required">*</span></label><input type="text" name="institution" class="form-control" required></div>
          <div class="form-group"><label>Course <span class="required">*</span></label><input type="text" name="course" class="form-control" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Year of Study <span class="required">*</span></label><input type="number" name="year_of_study" class="form-control" min="1" max="8" required></div>
          <div class="form-group"><label>Academic Year <span class="required">*</span></label><input type="text" name="academic_year" class="form-control" placeholder="e.g. 2026/2027" required></div>
        </div>
        <div class="form-group"><label>Personal Essay / Statement <span class="required">*</span></label><textarea name="essay" class="form-control" rows="4" required></textarea></div>
        <div class="form-group"><label>Letter of Application <span class="required">*</span></label>
          <input type="file" id="apply-letter" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" style="display:block;margin-top:0.3rem" required>
          <div class="form-hint">PDF or image.</div>
        </div>
        <div class="form-group"><label>TSC Slip <span class="required">*</span></label>
          <input type="file" id="apply-tsc" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" style="display:block;margin-top:0.3rem" required>
          <div class="form-hint">PDF or image.</div>
        </div>
      </form>
    </div>
    <div class="portal-modal-footer">
      <button class="modal-close-btn btn btn-outline btn-sm">Cancel</button>
      <button class="btn btn-gold btn-sm" onclick="submitApplication()"><i class="fas fa-paper-plane"></i> Submit Application</button>
    </div>
  </div>
</div>
<script src="/member/js/member-api.js"></script><script src="/member/js/member-portal.js"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getMemberSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getMemberTopbarHtml('Scholarships');
</script>
</body>
</html>
