<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Inbox — KUPPET Migori Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260622a"><link rel="stylesheet" href="/css/portal.css?v=20260622a">
</head>
<body class="portal-body admin-contacts-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1>Contact Inbox</h1><p>Review and manage member enquiries.</p></div>
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-status="">All</button>
        <button class="filter-tab" data-status="new">New</button>
        <button class="filter-tab" data-status="read">Read</button>
        <button class="filter-tab" data-status="replied">Replied</button>
        <button class="filter-tab" data-status="closed">Closed</button>
      </div>
      <div class="data-card">
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Name / Email</th><th>Phone</th><th>Category</th><th>Message</th><th>Status</th><th>Update Status</th></tr></thead>
            <tbody id="contacts-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/admin/js/admin-api.js"></script><script src="/admin/js/admin-portal.js"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getTopbarHtml('Contact Inbox');
</script>
</body>
</html>
