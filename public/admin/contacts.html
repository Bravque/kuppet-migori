<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=sessionStorage.getItem("adminToken"),la=parseInt(sessionStorage.getItem("adminLastActivity")||"0",10);if(!t||(la&&Date.now()-la>1800000)){sessionStorage.removeItem("adminToken");sessionStorage.removeItem("adminUser");sessionStorage.removeItem("adminLastActivity");location.replace("/admin/login.html");}})();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Inbox — KUPPET Migori Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260714a"><link rel="stylesheet" href="/css/portal.css?v=20260714a">
</head>
<body class="portal-body admin-contacts-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1>Contact Inbox</h1><p>Review and manage member enquiries and advocacy issue reports.</p></div>
      </div>
      <div class="filter-tabs" id="status-filters">
        <button class="filter-tab active" data-status="">All</button>
        <button class="filter-tab" data-status="new">New</button>
        <button class="filter-tab" data-status="read">Read</button>
        <button class="filter-tab" data-status="replied">Replied</button>
        <button class="filter-tab" data-status="closed">Closed</button>
      </div>
      <div class="filter-tabs" id="category-filters" style="margin-top:0.5rem">
        <button class="filter-tab active" data-category="">All Categories</button>
        <button class="filter-tab" data-category="advocacy" data-advocacy-only><i class="fas fa-gavel"></i> Advocacy Reports</button>
        <button class="filter-tab" data-category="membership">Membership</button>
        <button class="filter-tab" data-category="bbf">BBF</button>
        <button class="filter-tab" data-category="general">General</button>
        <button class="filter-tab" data-category="resources">Resources</button>
        <button class="filter-tab" data-category="other">Other</button>
      </div>
      <div class="data-card">
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Name / Email</th><th>Phone</th><th>Category</th><th>Message</th><th>Status</th><th>Update Status</th></tr></thead>
            <tbody id="contacts-tbody"></tbody>
          </table>
        </div>
        <div id="contacts-pager"></div>
      </div>
    </div>
  </main>
</div>

<!-- Reply modal -->
<div class="portal-modal-overlay" id="reply-modal">
  <div class="portal-modal" style="max-width:620px">
    <div class="portal-modal-header">
      <h3>Reply to Enquiry</h3>
      <button class="modal-close-btn"><i class="fas fa-times"></i></button>
    </div>
    <div class="portal-modal-body">
      <div id="reply-alert" class="hidden"></div>
      <div id="reply-context" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0.85rem 1rem;margin-bottom:1rem;font-size:0.85rem;line-height:1.5"></div>
      <form id="reply-form">
        <div class="form-group">
          <label>Your reply <span class="required">*</span></label>
          <textarea name="reply" class="form-control" rows="7" placeholder="Type your reply to the enquirer…" required></textarea>
        </div>
        <small class="form-hint">This is emailed to the enquirer and the enquiry is marked <strong>Replied</strong>.</small>
      </form>
    </div>
    <div class="portal-modal-footer">
      <button class="btn btn-outline btn-sm modal-close-btn-footer">Cancel</button>
      <button class="btn btn-gold btn-sm" id="reply-send-btn" onclick="sendReply()"><i class="fas fa-paper-plane"></i> Send Reply</button>
    </div>
  </div>
</div>

<script src="/admin/js/admin-api.js"></script><script src="/admin/js/admin-portal.js"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getTopbarHtml('Contact Inbox');
  document.querySelectorAll('#reply-modal .modal-close-btn, #reply-modal .modal-close-btn-footer')
    .forEach(b => b.addEventListener('click', () => document.getElementById('reply-modal').classList.remove('open')));
</script>
</body>
</html>
