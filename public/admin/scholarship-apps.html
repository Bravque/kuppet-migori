<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=sessionStorage.getItem("adminToken"),la=parseInt(sessionStorage.getItem("adminLastActivity")||"0",10);if(!t||(la&&Date.now()-la>1800000)){sessionStorage.removeItem("adminToken");sessionStorage.removeItem("adminUser");sessionStorage.removeItem("adminLastActivity");location.replace("/admin/login.html");}})();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarship Applications — KUPPET Migori Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260724f"><link rel="stylesheet" href="/css/portal.css?v=20260724f">
</head>
<body class="portal-body admin-schapp-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading"><div class="page-heading-text"><h1>Scholarship Applications</h1></div></div>
      <div class="filter-tabs" id="sch-tabs">
        <button class="filter-tab active" data-status="">All</button>
        <button class="filter-tab" data-status="applied">Applied</button>
        <button class="filter-tab" data-status="under_review">Under Review</button>
        <button class="filter-tab" data-status="approved">Approved</button>
        <button class="filter-tab" data-status="rejected">Rejected</button>
      </div>
      <div class="data-card">
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Application No</th><th>Member</th><th>Scholarship</th><th>Applicant</th><th>Status</th><th>Applied</th><th>Action</th></tr></thead>
            <tbody id="sch-tbody"></tbody>
          </table>
        </div>
        <div id="sch-pager"></div>
      </div>
    </div>
  </main>
</div>
<script src="/admin/js/admin-api.js?v=20260724f"></script><script src="/admin/js/admin-portal.js?v=20260724f"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getTopbarHtml('Scholarship Applications');
  const user = requireAdminAuth(); if(user) initSidebar(user);
  // Honour a ?status= deep-link (e.g. from the dashboard Quick Actions).
  let currentStatus=new URLSearchParams(window.location.search).get('status')||'', schOffset=0; const SCH_LIMIT=30;
  async function loadApps(){
    const tbody=document.getElementById('sch-tbody');
    tbody.innerHTML='<tr><td colspan="7">'+renderLoading()+'</td></tr>';
    try{
      const res=await adminApi.schApps.getAll({status:currentStatus,limit:SCH_LIMIT,offset:schOffset});
      const pager=()=>renderAdminPager('sch-pager',{total:res.total||0,offset:schOffset,limit:SCH_LIMIT,onPage:o=>{schOffset=o;loadApps();}});
      if(!res.data.length){tbody.innerHTML='<tr><td colspan="7">'+renderEmpty()+'</td></tr>';pager();return;}
      tbody.innerHTML=res.data.map(a=>`<tr>
        <td>${escHtml(a.application_number)}</td>
        <td>${escHtml(a.full_name)}<br><small>${escHtml(a.member_number)}</small></td>
        <td>${escHtml(a.scholarship_title)}</td>
        <td>${escHtml(a.applicant_name)}</td>
        <td>${statusBadge(a.status)}</td>
        <td>${formatDate(a.created_at)}</td>
        <td><a href="/admin/scholarship-app-detail.html?id=${a.id}" class="btn btn-outline btn-xs"><i class="fas fa-eye"></i> Review</a></td>
      </tr>`).join('');
      pager();
    }catch(err){tbody.innerHTML='<tr><td colspan="7">'+escHtml(err.message)+'</td></tr>';}
  }
  document.querySelectorAll('#sch-tabs .filter-tab').forEach(t=>{
    if(t.dataset.status===currentStatus) t.classList.add('active'); else t.classList.remove('active');
    t.addEventListener('click',()=>{
      document.querySelectorAll('#sch-tabs .filter-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');currentStatus=t.dataset.status;schOffset=0;loadApps();
    });
  });
  loadApps();
</script>
</body>
</html>
