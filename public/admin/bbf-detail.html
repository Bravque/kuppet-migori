<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=sessionStorage.getItem("adminToken"),la=parseInt(sessionStorage.getItem("adminLastActivity")||"0",10);if(!t||(la&&Date.now()-la>1800000)){sessionStorage.removeItem("adminToken");sessionStorage.removeItem("adminUser");sessionStorage.removeItem("adminLastActivity");location.replace("/admin/login.html");}})();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBF Claim Detail — KUPPET Migori Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260723a"><link rel="stylesheet" href="/css/portal.css?v=20260723a">
</head>
<body class="portal-body admin-bbf-detail-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1 id="claim-number">BBF Claim</h1><div id="claim-status"></div></div>
        <div class="page-heading-actions">
          <a href="/admin/bbf.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back</a>
          <button type="button" id="print-btn" class="btn btn-outline btn-sm" disabled onclick="printClaim()"><i class="fas fa-print"></i> Print</button>
        </div>
      </div>
      <div id="action-alert" class="hidden" style="margin-bottom:1rem"></div>
      <div id="action-buttons" style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem"></div>
      <div class="grid-2" style="gap:1rem">
        <div>
          <div class="data-card" style="margin-bottom:1rem">
            <div class="data-card-header"><div class="data-card-title">Claim Details</div></div>
            <div style="padding:1.25rem" id="claim-details"></div>
          </div>
          <div class="data-card">
            <div class="data-card-header"><div class="data-card-title">Documents</div></div>
            <div style="padding:1.25rem"><ul class="doc-list" id="doc-list"></ul></div>
          </div>
        </div>
        <div class="data-card">
          <div class="data-card-header"><div class="data-card-title">Status Timeline</div></div>
          <div style="padding:1.25rem"><div class="timeline" id="timeline"></div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Action modal -->
<div class="portal-modal-overlay" id="action-modal">
  <div class="portal-modal" style="max-width:460px">
    <div class="portal-modal-header"><h3 id="action-modal-title">Action</h3><button class="modal-close-btn"><i class="fas fa-times"></i></button></div>
    <div class="portal-modal-body">
      <p id="action-modal-intro" style="font-size:0.85rem;color:var(--text-muted);margin-bottom:1rem"></p>
      <div class="form-group" id="amount-row" style="display:none">
        <label>Approved amount (KES)</label>
        <input type="number" id="m-amount" class="form-control" min="0" placeholder="Leave blank to use the requested amount">
      </div>
      <div class="form-group" id="ref-row" style="display:none">
        <label>Payment reference</label>
        <input type="text" id="m-ref" class="form-control" placeholder="e.g. MPESA / RTGS reference (optional)">
      </div>
      <div class="form-group" id="notes-row">
        <label id="notes-label">Notes (optional)</label>
        <textarea id="m-notes" class="form-control" rows="3"></textarea>
      </div>
    </div>
    <div class="portal-modal-footer">
      <button class="modal-close-btn btn btn-outline btn-sm">Cancel</button>
      <button id="action-confirm-btn" class="btn btn-gold btn-sm"><i class="fas fa-check"></i> Confirm</button>
    </div>
  </div>
</div>

<script src="/admin/js/admin-api.js?v=20260723a"></script><script src="/admin/js/admin-portal.js?v=20260723a"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getTopbarHtml('BBF Claim Detail');
  const user = requireAdminAuth(); if(user) initSidebar(user);
  // Approve/reject/mark-paid are branch_officer + super_admin decisions; branch_secretary
  // may view/print and start review only (backend enforces). Hide decision buttons.
  const canDecide = !!user && ['super_admin','branch_officer'].includes(user.role);
  const id = new URLSearchParams(window.location.search).get('id');
  if(!id){window.location.href='/admin/bbf.html';}

  const DOC_LABELS = {tsc_slip:'TSC Slip',burial_permit:'Burial Permit',birth_notification:'Birth Notification',letter_from_principal:'Letter From Principal',other:'Other'};
  let CURRENT = null;   // the loaded claim, used by printClaim()

  // Print the full claim + attachments (available to every admin role).
  function printClaim(){
    const c = CURRENT; if(!c) return;
    const money = v => v ? 'KES ' + Number(v).toLocaleString() : '—';
    const sections = [
      { title:'Claim', rows:[
        ['Claim No', escHtml(c.claim_number)],
        ['Type', escHtml(bbfTypeLabel(c.claim_type))],
        ['Status', escHtml((c.status||'').replace(/_/g,' '))],
        ['Amount Approved', money(c.amount_approved)],
        ['Submitted', formatDate(c.submitted_at)],
        ['Reviewed', formatDate(c.reviewed_at)],
        ['Resolved', formatDate(c.resolved_at)],
        ['Reviewer Notes', escHtml(c.reviewer_notes||'—')],
        ['Payment Ref', escHtml(c.payment_reference||'—')],
      ]},
      { title:"Applicant's Details", rows:[
        ['Name', escHtml(c.full_name||'—')],
        ['Member No', escHtml(c.member_number||'—')],
        ['Phone', escHtml(c.phone||'—')],
        ['Email', escHtml(c.email||'—')],
        ['TSC No', escHtml(c.tsc_no||'—')],
        ['Sub-County', escHtml(c.sub_county||'—')],
        ['School', escHtml(c.school||'—')],
        ['Category', escHtml(bbfSchoolCatLabel(c.school_category))],
      ]},
    ];
    if(c.claim_type==='death'){
      sections.push({ title:'Deceased Person Details', rows:[
        ['Name', escHtml(c.deceased_name||'—')],
        ['Relationship with Applicant', escHtml(c.relationship||'—')],
        ['Date of Death', formatDate(c.date_of_death)],
      ]});
    }
    const documents = (c.documents||[]).map(d => ({ label: DOC_LABELS[d.doc_type]||d.doc_type||'Document', file_url: d.file_url }));
    printApplication({ heading:'BBF Claim — '+(c.claim_number||''), subheading:'Benevolent Benefit Fund claim record', sections, documents });
  }
  (async()=>{
    try {
      const res = await adminApi.bbf.getOne(id);
      const c = res.data;
      document.getElementById('claim-number').textContent = c.claim_number;
      document.getElementById('claim-status').innerHTML = statusBadge(c.status);
      const section = (title, rows) => `
        <div style="margin-bottom:1.25rem">
          <div style="font-size:0.72rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted);border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:0.25rem;margin-bottom:0.75rem">${title}</div>
          <table style="width:100%;font-size:0.85rem;border-collapse:collapse">
            ${rows.map(([k,v])=>`<tr><td style="padding:0.4rem 0;color:var(--text-muted);width:40%">${k}</td><td>${v||'—'}</td></tr>`).join('')}
          </table>
        </div>`;

      const claimRows=[['Claim No',c.claim_number],['Type',bbfTypeLabel(c.claim_type)],['Status',statusBadge(c.status)],
        ['Amount Approved',c.amount_approved?'KES '+Number(c.amount_approved).toLocaleString():'—'],
        ['Submitted',formatDate(c.submitted_at)],['Reviewed',formatDate(c.reviewed_at)],['Resolved',formatDate(c.resolved_at)],
        ['Notes',c.reviewer_notes||'—'],['Payment Ref',c.payment_reference||'—']];

      const applicantRows=[['Name',escHtml(c.full_name||'—')],['Member No',escHtml(c.member_number||'—')],
        ['Phone',escHtml(c.phone||'—')],['Email',escHtml(c.email||'—')],['TSC No',escHtml(c.tsc_no||'—')],
        ['Sub-County',escHtml(c.sub_county||'—')],['School',escHtml(c.school||'—')],['Category',bbfSchoolCatLabel(c.school_category)]];

      let detailsHtml = section('Claim', claimRows) + section("Applicant's Details", applicantRows);
      if (c.claim_type==='death') {
        detailsHtml += section('Deceased Person Details', [['Name',escHtml(c.deceased_name||'—')],
          ['Relationship with Applicant',escHtml(c.relationship||'—')],['Date of Death',formatDate(c.date_of_death)]]);
      }
      document.getElementById('claim-details').innerHTML = detailsHtml;
      CURRENT = c;
      document.getElementById('print-btn').disabled = false;
      document.getElementById('doc-list').innerHTML = c.documents.length ? c.documents.map(d=>`<li class="doc-item"><i class="fas fa-file doc-icon"></i><span class="doc-name">${escHtml(d.file_name||d.file_url)}</span><span class="doc-size">${escHtml(DOC_LABELS[d.doc_type]||d.doc_type)}</span><button type="button" onclick="viewDoc('${escHtml(d.file_url)}')" class="btn btn-outline btn-xs">View</button></li>`).join('') : '<li style="padding:0.5rem;color:var(--text-muted)">No documents</li>';
      document.getElementById('timeline').innerHTML = c.timeline.map(e=>`<div class="timeline-item status-${e.to_status}"><div class="timeline-dot"><i class="fas fa-circle" style="font-size:0.45rem"></i></div><div class="timeline-content"><div class="timeline-status">${escHtml(e.to_status.replace(/_/g,' '))}</div><div class="timeline-meta">${formatDateTime(e.created_at)} by ${escHtml(e.changed_by_type)}</div>${e.comment?`<div class="timeline-comment">${escHtml(e.comment)}</div>`:''}</div></div>`).join('');

      // Action buttons based on status
      const btns = document.getElementById('action-buttons');
      let bhtml='';
      if(c.status==='submitted')    bhtml=`<button id="act-review" class="btn btn-outline btn-sm"><i class="fas fa-search"></i> Start Review</button>`;
      if(canDecide && c.status==='under_review') bhtml=`<button id="act-approve" class="btn btn-sm" style="background:#DCFCE7;color:#166534"><i class="fas fa-check"></i> Approve</button><button id="act-reject" class="btn btn-sm" style="background:#FEE2E2;color:#991B1B"><i class="fas fa-times"></i> Reject</button>`;
      if(canDecide && c.status==='approved')     bhtml=`<button id="act-paid" class="btn btn-gold btn-sm"><i class="fas fa-money-bill"></i> Mark as Paid</button>`;
      btns.innerHTML=bhtml;
      document.getElementById('act-review')?.addEventListener('click',()=>openAction('review'));
      document.getElementById('act-approve')?.addEventListener('click',()=>openAction('approve'));
      document.getElementById('act-reject')?.addEventListener('click',()=>openAction('reject'));
      document.getElementById('act-paid')?.addEventListener('click',()=>openAction('paid'));

      const modal = document.getElementById('action-modal');
      const INTRO = {
        review:  'Move this claim into review. You may add an internal note.',
        approve: 'Approve this claim. Optionally set an approved amount and a note for the member.',
        reject:  'Reject this claim. Please give a reason — it is shared with the member.',
        paid:    'Mark this approved claim as paid and record the payment reference.',
      };
      const TITLES = { review:'Start Review', approve:'Approve Claim', reject:'Reject Claim', paid:'Mark as Paid' };

      function openAction(action){
        document.getElementById('action-modal-title').textContent = TITLES[action];
        document.getElementById('action-modal-intro').textContent = INTRO[action];
        document.getElementById('amount-row').style.display = action==='approve' ? '' : 'none';
        document.getElementById('ref-row').style.display    = action==='paid'    ? '' : 'none';
        document.getElementById('notes-row').style.display  = action==='paid'    ? 'none' : '';
        document.getElementById('notes-label').textContent  = action==='reject' ? 'Reason for rejection' : 'Notes (optional)';
        document.getElementById('m-amount').value='';
        document.getElementById('m-ref').value='';
        document.getElementById('m-notes').value='';
        const btn = document.getElementById('action-confirm-btn');
        btn.onclick = () => submitAction(action);
        modal.classList.add('open');
      }

      async function submitAction(action){
        const notes  = document.getElementById('m-notes').value.trim();
        const amount = document.getElementById('m-amount').value || null;
        const ref    = document.getElementById('m-ref').value.trim();
        if(action==='reject' && !notes){ showAlert('action-alert','A rejection reason is required.'); return; }
        const btn = document.getElementById('action-confirm-btn');
        btn.disabled = true;
        try {
          if(action==='review')  await adminApi.bbf.startReview(id, notes);
          if(action==='approve') await adminApi.bbf.approve(id, amount, notes);
          if(action==='reject')  await adminApi.bbf.reject(id, notes);
          if(action==='paid')    await adminApi.bbf.markPaid(id, ref);
          modal.classList.remove('open');
          showAlert('action-alert','Action completed successfully','success');
          setTimeout(()=>window.location.reload(),1200);
        } catch(e){ showAlert('action-alert',e.message); btn.disabled=false; }
      }
    } catch(err){showAlert('action-alert',err.message);}
  })();
</script>
</body>
</html>
