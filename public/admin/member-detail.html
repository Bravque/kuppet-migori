<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=sessionStorage.getItem("adminToken"),la=parseInt(sessionStorage.getItem("adminLastActivity")||"0",10);if(!t||(la&&Date.now()-la>1800000)){sessionStorage.removeItem("adminToken");sessionStorage.removeItem("adminUser");sessionStorage.removeItem("adminLastActivity");location.replace("/admin/login.html");}})();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Detail — KUPPET Migori Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260725c"><link rel="stylesheet" href="/css/portal.css?v=20260725c">
</head>
<body class="portal-body admin-member-detail-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1 id="member-name">Member Detail</h1><div id="member-status"></div></div>
        <div class="page-heading-actions">
          <a href="/admin/members.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back</a>
          <button id="btn-approve" class="btn btn-sm" style="background:#DCFCE7;color:#166534;display:none"><i class="fas fa-check"></i> Approve</button>
          <button id="btn-reject" class="btn btn-sm" style="background:#FEE2E2;color:#991B1B;display:none"><i class="fas fa-times"></i> Reject</button>
          <button id="btn-suspend" class="btn btn-sm" style="background:#F3F4F6;color:#4B5563;display:none"><i class="fas fa-ban"></i> Suspend</button>
        </div>
      </div>
      <div id="detail-alert" class="hidden" style="max-width:700px;margin-bottom:1rem"></div>
      <div class="grid-2" style="gap:1rem">
        <div class="data-card">
          <div class="data-card-header"><div class="data-card-title">Personal Information</div></div>
          <div style="padding:1.25rem">
            <table style="width:100%;font-size:0.85rem;border-collapse:collapse" id="info-table"></table>
          </div>
        </div>
        <div class="data-card" id="doc-card" style="display:none">
          <div class="data-card-header"><div class="data-card-title">Documents</div></div>
          <div style="padding:1.25rem" id="doc-section"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Reason modal -->
<div class="portal-modal-overlay" id="reason-modal">
  <div class="portal-modal" style="max-width:440px">
    <div class="portal-modal-header"><h3 id="reason-title">Reason</h3><button class="modal-close-btn"><i class="fas fa-times"></i></button></div>
    <div class="portal-modal-body">
      <div class="form-group"><label id="reason-label">Reason</label><textarea id="reason-input" class="form-control" rows="3"></textarea></div>
    </div>
    <div class="portal-modal-footer">
      <button class="modal-close-btn btn btn-outline btn-sm">Cancel</button>
      <button id="reason-confirm" class="btn btn-gold btn-sm"><i class="fas fa-check"></i> Confirm</button>
    </div>
  </div>
</div>

<script src="/admin/js/admin-api.js?v=20260725c"></script><script src="/admin/js/admin-portal.js?v=20260725c"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getTopbarHtml('Member Detail');
  const user = requireAdminAuth(); if(user) initSidebar(user);
  // Approve/reject/suspend are branch_officer + super_admin decisions; branch_secretary
  // may view/print only. Backend enforces this; here we just hide the buttons.
  const canDecide = !!user && ['super_admin','branch_officer'].includes(user.role);
  const id = new URLSearchParams(window.location.search).get('id');
  if(!id){window.location.href='/admin/members.html';}
  (async()=>{
    try {
      const res = await adminApi.members.getOne(id);
      const m = res.data;
      document.getElementById('member-name').textContent = m.full_name;
      document.getElementById('member-status').innerHTML = statusBadge(m.status);
      const rows = [
        ['Member No', m.member_number],['TSC Number',m.tsc_number],['National ID',m.national_id],
        ['Employment No',m.employment_number||'—'],['Job Group',m.job_group||'—'],['Phone',m.phone],['Email',m.email],
        ['Gender',m.gender],['Date of Birth',formatDate(m.date_of_birth)],
        ['School',m.school_name],['Sub-County',m.sub_county],['Category',bbfSchoolCatLabel(m.school_category)],
        ['Status',statusBadge(m.status)],['Registered',formatDate(m.created_at)],
        ['Approved',formatDate(m.approved_at)],
      ];
      document.getElementById('info-table').innerHTML = rows.map(([k,v])=>`<tr><td style="padding:0.4rem 0;color:var(--text-muted);width:45%">${k}</td><td style="font-weight:500">${v||'—'}</td></tr>`).join('');
      // Documents are no longer collected at registration; show this card only for
      // legacy/imported members that still have uploaded files on record.
      const docsHtml = [
        m.passport_photo_url ? `<div class="doc-item"><i class="fas fa-camera doc-icon"></i><span class="doc-name">Passport Photo</span><button type="button" onclick="viewDoc('${escHtml(m.passport_photo_url)}')" class="btn btn-outline btn-xs">View</button></div>` : '',
        m.national_id_url ? `<div class="doc-item"><i class="fas fa-id-card doc-icon"></i><span class="doc-name">National ID Copy</span><button type="button" onclick="viewDoc('${escHtml(m.national_id_url)}')" class="btn btn-outline btn-xs">View</button></div>` : '',
      ].join('');
      if(docsHtml){
        document.getElementById('doc-section').innerHTML = docsHtml;
        document.getElementById('doc-card').style.display = '';
      }
      if(canDecide){
        if(m.status!=='approved'){document.getElementById('btn-approve').style.display='';}
        if(m.status!=='rejected'){document.getElementById('btn-reject').style.display='';}
        if(m.status!=='suspended'){document.getElementById('btn-suspend').style.display='';}
      }
      const reasonModal = document.getElementById('reason-modal');
      function askReason(title, label, onConfirm){
        document.getElementById('reason-title').textContent = title;
        document.getElementById('reason-label').textContent = label;
        document.getElementById('reason-input').value = '';
        const btn = document.getElementById('reason-confirm');
        btn.onclick = async () => {
          const v = document.getElementById('reason-input').value.trim();
          reasonModal.classList.remove('open');
          await onConfirm(v);
        };
        reasonModal.classList.add('open');
        setTimeout(()=>document.getElementById('reason-input').focus(), 50);
      }

      document.getElementById('btn-approve').addEventListener('click',async()=>{
        if(!confirm('Approve this member?'))return;
        try{await adminApi.members.approve(id);showAlert('detail-alert','Member approved!','success');setTimeout(()=>window.location.reload(),1500);}catch(e){showAlert('detail-alert',e.message);}
      });
      document.getElementById('btn-reject').addEventListener('click',()=>{
        askReason('Reject Member','Reason for rejection (shared with the member)', async(reason)=>{
          if(!reason){showAlert('detail-alert','A rejection reason is required.');return;}
          try{await adminApi.members.reject(id,reason);showAlert('detail-alert','Member rejected','success');setTimeout(()=>window.location.reload(),1500);}catch(e){showAlert('detail-alert',e.message);}
        });
      });
      document.getElementById('btn-suspend').addEventListener('click',()=>{
        askReason('Suspend Member','Reason for suspension', async(reason)=>{
          try{await adminApi.members.suspend(id, reason || 'Suspended by admin');showAlert('detail-alert','Member suspended','success');setTimeout(()=>window.location.reload(),1500);}catch(e){showAlert('detail-alert',e.message);}
        });
      });
    } catch(err){showAlert('detail-alert',err.message);}
  })();
</script>
</body>
</html>
