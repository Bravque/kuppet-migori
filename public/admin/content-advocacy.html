<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=sessionStorage.getItem("adminToken"),la=parseInt(sessionStorage.getItem("adminLastActivity")||"0",10);if(!t||(la&&Date.now()-la>1800000)){sessionStorage.removeItem("adminToken");sessionStorage.removeItem("adminUser");sessionStorage.removeItem("adminLastActivity");location.replace("/admin/login.html");}})();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advocacy — KUPPET Migori Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260725j"><link rel="stylesheet" href="/css/portal.css?v=20260725j">
</head>
<body class="portal-body admin-content-advocacy-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1>Advocacy</h1><p>Manage advocacy articles &amp; resources.</p></div>
        <button class="btn btn-gold btn-sm" onclick="openNew()"><i class="fas fa-plus"></i> New Item</button>
      </div>
      <div id="alert" class="hidden" style="margin-bottom:1rem"></div>
      <div class="data-card">
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="tbody"><tr><td colspan="5" class="portal-loading"><i class="fas fa-spinner fa-spin"></i> Loading…</td></tr></tbody>
          </table>
        </div>
        <div id="adv-pager"></div>
      </div>
    </div>
  </main>
</div>

<div class="portal-modal-overlay" id="modal">
  <div class="portal-modal" style="max-width:700px">
    <div class="portal-modal-header"><h3 id="modal-title">New Advocacy Item</h3><button class="modal-close-btn"><i class="fas fa-times"></i></button></div>
    <div class="portal-modal-body">
      <div id="form-alert" class="hidden"></div>
      <form id="form">
        <div class="form-group"><label>Title <span class="required">*</span></label><input name="title" class="form-control" required></div>
        <div class="form-row">
          <div class="form-group"><label>Category</label>
            <select name="category" class="form-control">
              <option value="rights">Rights</option>
              <option value="legal">Legal</option>
              <option value="labour">Labour</option>
              <option value="policy">Policy</option>
              <option value="news">News</option>
              <option value="report">Report</option>
            </select>
          </div>
          <div class="form-group"><label>Document URL (optional)</label><input name="document_url" class="form-control" placeholder="https://…"></div>
        </div>
        <div class="form-group">
          <label>Content <span class="required">*</span></label>
          <div class="rt-toolbar" data-rt-target="advocacy-content">
            <button type="button" class="rt-btn" data-rt="bold" title="Bold"><i class="fas fa-bold"></i></button>
            <button type="button" class="rt-btn" data-rt="italic" title="Italic"><i class="fas fa-italic"></i></button>
            <span class="rt-sep"></span>
            <button type="button" class="rt-btn" data-rt="ol" title="Numbered list"><i class="fas fa-list-ol"></i></button>
            <button type="button" class="rt-btn" data-rt="ul" title="Bulleted list"><i class="fas fa-list-ul"></i></button>
            <span class="rt-sep"></span>
            <button type="button" class="rt-btn" data-rt="align-left" title="Align left"><i class="fas fa-align-left"></i></button>
            <button type="button" class="rt-btn" data-rt="align-center" title="Align center"><i class="fas fa-align-center"></i></button>
            <button type="button" class="rt-btn" data-rt="align-right" title="Align right"><i class="fas fa-align-right"></i></button>
            <span class="rt-sep"></span>
            <button type="button" class="rt-btn" data-rt="link" title="Insert link"><i class="fas fa-link"></i></button>
          </div>
          <textarea id="advocacy-content" name="content" class="form-control" rows="8" placeholder="Full content (HTML supported)" required></textarea>
        </div>
        <div style="display:flex;gap:1.25rem;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.82rem;cursor:pointer"><input type="checkbox" name="is_published" checked> Published</label>
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.82rem;cursor:pointer"><input type="checkbox" name="is_featured"> Featured</label>
        </div>
      </form>
    </div>
    <div class="portal-modal-footer">
      <button type="button" class="modal-close-btn btn btn-outline btn-sm">Cancel</button>
      <button type="button" class="btn btn-gold btn-sm" onclick="submitOnce(this, save)"><i class="fas fa-save"></i> Save</button>
    </div>
  </div>
</div>

<script src="/admin/js/admin-api.js?v=20260725j"></script><script src="/admin/js/admin-portal.js?v=20260725j"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getTopbarHtml('Advocacy');
  const user = requireAdminAuth(); if(user) initSidebar(user);
  let editingId = null;
  const f = sel => document.getElementById('form').querySelector(`[name=${sel}]`);

  let advOffset=0; const ADV_LIMIT=20;
  async function load(){
    const tb=document.getElementById('tbody');
    tb.innerHTML='<tr><td colspan="5">'+renderLoading()+'</td></tr>';
    try{
      const res=await adminApi.advocacy.getAll({limit:ADV_LIMIT,offset:advOffset});
      const pager=()=>renderAdminPager('adv-pager',{total:res.total||0,offset:advOffset,limit:ADV_LIMIT,onPage:o=>{advOffset=o;load();}});
      if(!res.data.length){tb.innerHTML='<tr><td colspan="5">'+renderEmpty()+'</td></tr>';pager();return;}
      tb.innerHTML=res.data.map(a=>`<tr>
        <td><strong>${escHtml(a.title)}</strong></td>
        <td>${escHtml((a.category||'').replace(/_/g,' '))}</td>
        <td>${statusBadge(a.is_published?'approved':'draft')}${a.is_featured?' <span class="status-badge status-badge--paid">Featured</span>':''}</td>
        <td>${formatDate(a.created_at)}</td>
        <td>
          <button class="btn btn-outline btn-xs" onclick='edit(${JSON.stringify(a).replace(/'/g,"&#39;")})'><i class="fas fa-edit"></i></button>
          <button class="btn btn-xs" style="background:#FEE2E2;color:#991B1B" onclick="del(${a.id})"><i class="fas fa-trash"></i></button>
        </td>
      </tr>`).join('');
      pager();
    }catch(err){showAlert('alert',err.message);}
  }

  function openNew(){
    editingId=null;
    document.getElementById('form').reset();
    refreshRichEditor(f('content'));
    document.getElementById('modal-title').textContent='New Advocacy Item';
    document.getElementById('form-alert').className='hidden';
    document.getElementById('modal').classList.add('open');
  }
  function edit(a){
    editingId=a.id;
    document.getElementById('form').reset();
    ['title','category','document_url','content'].forEach(k=>{ if(f(k)) f(k).value = a[k]||''; });
    refreshRichEditor(f('content'));
    f('is_published').checked = !!a.is_published;
    f('is_featured').checked = !!a.is_featured;
    document.getElementById('modal-title').textContent='Edit Advocacy Item';
    document.getElementById('form-alert').className='hidden';
    document.getElementById('modal').classList.add('open');
  }
  async function save(){
    const data={
      title:f('title').value.trim(), category:f('category').value,
      document_url:f('document_url').value.trim()||null, content:f('content').value.trim(),
      is_published:f('is_published').checked, is_featured:f('is_featured').checked,
    };
    if(!data.title||!data.content){showAlert('form-alert','Title and content are required');return;}
    try{
      editingId ? await adminApi.advocacy.update(editingId,data) : await adminApi.advocacy.create(data);
      document.getElementById('modal').classList.remove('open');
      load();
    }catch(err){showAlert('form-alert',err.message);}
  }
  async function del(id){
    if(!confirm('Delete this advocacy item? This cannot be undone.'))return;
    try{await adminApi.advocacy.remove(id);load();}catch(e){showAlert('alert',e.message);}
  }
  load();
</script>
</body>
</html>
