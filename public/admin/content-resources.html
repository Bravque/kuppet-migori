<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=sessionStorage.getItem("adminToken"),la=parseInt(sessionStorage.getItem("adminLastActivity")||"0",10);if(!t||(la&&Date.now()-la>1800000)){sessionStorage.removeItem("adminToken");sessionStorage.removeItem("adminUser");sessionStorage.removeItem("adminLastActivity");location.replace("/admin/login.html");}})();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources — KUPPET Migori Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260717b"><link rel="stylesheet" href="/css/portal.css?v=20260717b">
</head>
<body class="portal-body admin-content-resources-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1>Resources</h1><p>Manage downloadable resources for members.</p></div>
        <button class="btn btn-gold btn-sm" onclick="openNew()"><i class="fas fa-plus"></i> New Resource</button>
      </div>
      <div id="alert" class="hidden" style="margin-bottom:1rem"></div>
      <div class="data-card">
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Title</th><th>Category</th><th>Subject</th><th>Status</th><th>Downloads</th><th>Actions</th></tr></thead>
            <tbody id="tbody"><tr><td colspan="6" class="portal-loading"><i class="fas fa-spinner fa-spin"></i> Loading…</td></tr></tbody>
          </table>
        </div>
        <div id="res-pager"></div>
      </div>
    </div>
  </main>
</div>

<div class="portal-modal-overlay" id="modal">
  <div class="portal-modal" style="max-width:660px">
    <div class="portal-modal-header"><h3 id="modal-title">New Resource</h3><button class="modal-close-btn"><i class="fas fa-times"></i></button></div>
    <div class="portal-modal-body">
      <div id="form-alert" class="hidden"></div>
      <form id="form">
        <div class="form-group"><label>Title <span class="required">*</span></label><input name="title" class="form-control" required></div>
        <div class="form-group"><label>Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label>Category</label>
            <select name="category" class="form-control">
              <option value="curriculum">Curriculum</option>
              <option value="circular">Circular</option>
              <option value="moe_document">MoE Document</option>
              <option value="tsc_resource">TSC Resource</option>
              <option value="professional_dev">Professional Development</option>
              <option value="teaching_material">Teaching Material</option>
              <option value="legal">Legal</option>
              <option value="policy">Policy</option>
              <option value="sport_entertainment">Sports &amp; Entertainment</option>
            </select>
          </div>
          <div class="form-group"><label>Subject</label><input name="subject" class="form-control" placeholder="e.g. Mathematics"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Grade / Level</label><input name="grade_level" class="form-control" placeholder="e.g. Form 4"></div>
          <div class="form-group"><label>External URL (optional)</label><input name="external_url" class="form-control" placeholder="https://… (if not uploading a file)"></div>
        </div>
        <div class="form-group"><label>File</label>
          <input type="file" name="file" class="form-control" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png,.doc,.docx">
          <div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.25rem">PDF/DOC/image, max 10 MB. Leave blank to keep the current file (or use an External URL).</div>
        </div>
        <div style="display:flex;gap:1.25rem;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.82rem;cursor:pointer"><input type="checkbox" name="is_published" checked> Published</label>
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.82rem;cursor:pointer"><input type="checkbox" name="is_featured"> Featured</label>
        </div>
      </form>
    </div>
    <div class="portal-modal-footer">
      <button class="modal-close-btn btn btn-outline btn-sm">Cancel</button>
      <button class="btn btn-gold btn-sm" onclick="submitOnce(this, save)"><i class="fas fa-save"></i> Save</button>
    </div>
  </div>
</div>

<script src="/admin/js/admin-api.js"></script><script src="/admin/js/admin-portal.js"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getTopbarHtml('Resources');
  const user = requireAdminAuth(); if(user) initSidebar(user);
  let editingId = null;
  const f = sel => document.getElementById('form').querySelector(`[name=${sel}]`);

  let resOffset=0; const RES_LIMIT=20;
  async function load(){
    const tb=document.getElementById('tbody');
    tb.innerHTML='<tr><td colspan="6">'+renderLoading()+'</td></tr>';
    try{
      const res=await adminApi.resources.getAll({limit:RES_LIMIT,offset:resOffset});
      const pager=()=>renderAdminPager('res-pager',{total:res.total||0,offset:resOffset,limit:RES_LIMIT,onPage:o=>{resOffset=o;load();}});
      if(!res.data.length){tb.innerHTML='<tr><td colspan="6">'+renderEmpty()+'</td></tr>';pager();return;}
      tb.innerHTML=res.data.map(r=>`<tr>
        <td><strong>${escHtml(r.title)}</strong></td>
        <td>${escHtml((r.category||'').replace(/_/g,' '))}</td>
        <td>${escHtml(r.subject||'—')}</td>
        <td>${statusBadge(r.is_published?'approved':'draft')}${r.is_featured?' <span class="status-badge status-badge--paid">Featured</span>':''}</td>
        <td>${r.download_count||0}</td>
        <td>
          <button class="btn btn-outline btn-xs" onclick='edit(${JSON.stringify(r).replace(/'/g,"&#39;")})'><i class="fas fa-edit"></i></button>
          <button class="btn btn-xs" style="background:#FEE2E2;color:#991B1B" onclick="del(${r.id})"><i class="fas fa-trash"></i></button>
        </td>
      </tr>`).join('');
      pager();
    }catch(err){showAlert('alert',err.message);}
  }

  function openNew(){
    editingId=null;
    document.getElementById('form').reset();
    document.getElementById('modal-title').textContent='New Resource';
    document.getElementById('form-alert').className='hidden';
    document.getElementById('modal').classList.add('open');
  }
  function edit(r){
    editingId=r.id;
    document.getElementById('form').reset();
    ['title','description','category','subject','grade_level','external_url'].forEach(k=>{ if(f(k)) f(k).value = r[k]||''; });
    f('is_published').checked = !!r.is_published;
    f('is_featured').checked = !!r.is_featured;
    document.getElementById('modal-title').textContent='Edit Resource';
    document.getElementById('form-alert').className='hidden';
    document.getElementById('modal').classList.add('open');
  }
  async function save(){
    if(!f('title').value.trim()){showAlert('form-alert','Title is required');return;}
    const fd=new FormData();
    ['title','description','category','subject','grade_level','external_url'].forEach(k=>fd.append(k, f(k).value.trim()));
    fd.append('is_published', f('is_published').checked ? '1' : '0');
    fd.append('is_featured', f('is_featured').checked ? '1' : '0');
    const file=f('file').files[0];
    if(file) fd.append('file', file);
    try{
      editingId ? await adminApi.resources.update(editingId,fd) : await adminApi.resources.create(fd);
      document.getElementById('modal').classList.remove('open');
      load();
    }catch(err){showAlert('form-alert',err.message);}
  }
  async function del(id){
    if(!confirm('Delete this resource? This cannot be undone.'))return;
    try{await adminApi.resources.remove(id);load();}catch(e){showAlert('alert',e.message);}
  }
  load();
</script>
</body>
</html>
