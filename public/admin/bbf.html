<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBF Claims — KUPPET Migori Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260617b"><link rel="stylesheet" href="/css/portal.css?v=20260617b">
</head>
<body class="portal-body admin-bbf-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1>BBF Claims</h1></div>
        <button class="btn btn-outline btn-sm" onclick="adminApi.bbf.exportExcel ? adminApi.bbf.exportExcel() : window.open('/api/admin/bbf/export','_blank')"><i class="fas fa-file-excel"></i> Export</button>
      </div>
      <div class="filter-tabs" id="bbf-tabs">
        <button class="filter-tab active" data-status="">All</button>
        <button class="filter-tab" data-status="submitted">Submitted</button>
        <button class="filter-tab" data-status="under_review">Under Review</button>
        <button class="filter-tab" data-status="approved">Approved</button>
        <button class="filter-tab" data-status="rejected">Rejected</button>
        <button class="filter-tab" data-status="paid">Paid</button>
      </div>
      <div class="data-card">
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Claim No</th><th>Member</th><th>Type</th><th>Amount Requested</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead>
            <tbody id="bbf-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/admin/js/admin-api.js"></script><script src="/admin/js/admin-portal.js"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getTopbarHtml('BBF Claims');
  const user = requireAdminAuth(); if(user) initSidebar(user);
  let currentStatus = new URLSearchParams(window.location.search).get('status') || '';
  async function loadBbf() {
    const tbody = document.getElementById('bbf-tbody');
    tbody.innerHTML = '<tr><td colspan="7">'+renderLoading()+'</td></tr>';
    try {
      const res = await adminApi.bbf.getAll({status:currentStatus,limit:30});
      if(!res.data.length){tbody.innerHTML='<tr><td colspan="7">'+renderEmpty()+'</td></tr>';return;}
      tbody.innerHTML = res.data.map(c=>`<tr>
        <td><strong>${escHtml(c.claim_number)}</strong></td>
        <td>${escHtml(c.full_name)}<br><small>${escHtml(c.member_number)}</small></td>
        <td>${escHtml(c.claim_type.replace(/_/g,' '))}</td>
        <td>${c.amount_requested ? 'KES '+Number(c.amount_requested).toLocaleString() : '—'}</td>
        <td>${statusBadge(c.status)}</td>
        <td>${formatDate(c.submitted_at)}</td>
        <td><a href="/admin/bbf-detail.html?id=${c.id}" class="btn btn-outline btn-xs"><i class="fas fa-eye"></i> Review</a></td>
      </tr>`).join('');
    } catch(err){tbody.innerHTML='<tr><td colspan="7">'+escHtml(err.message)+'</td></tr>';}
  }
  document.querySelectorAll('#bbf-tabs .filter-tab').forEach(t=>{
    if(t.dataset.status===currentStatus) t.classList.add('active'); else t.classList.remove('active');
    t.addEventListener('click',()=>{
      document.querySelectorAll('#bbf-tabs .filter-tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');currentStatus=t.dataset.status;loadBbf();
    });
  });
  loadBbf();
</script>
</body>
</html>
