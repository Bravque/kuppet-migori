<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=sessionStorage.getItem("adminToken"),la=parseInt(sessionStorage.getItem("adminLastActivity")||"0",10);if(!t||(la&&Date.now()-la>1800000)){sessionStorage.removeItem("adminToken");sessionStorage.removeItem("adminUser");sessionStorage.removeItem("adminLastActivity");location.replace("/admin/login.html");}})();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBF Claims — KUPPET Migori Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260725g"><link rel="stylesheet" href="/css/portal.css?v=20260725g">
</head>
<body class="portal-body admin-bbf-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1>BBF Claims</h1></div>
        <button id="btn-export" class="btn btn-outline btn-sm"><i class="fas fa-file-excel"></i> Export</button>
      </div>
      <div class="filter-tabs" id="bbf-tabs">
        <button class="filter-tab active" data-status="">All</button>
        <button class="filter-tab" data-status="submitted">Submitted</button>
        <button class="filter-tab" data-status="under_review">Under Review</button>
        <button class="filter-tab" data-status="approved">Approved</button>
        <button class="filter-tab" data-status="rejected">Rejected</button>
        <button class="filter-tab" data-status="paid">Paid</button>
      </div>
      <div class="filter-bar">
        <input type="search" class="form-control" id="school-search" placeholder="Search by school...">
        <select class="form-control" id="type-filter">
          <option value="">All Types</option>
          <option value="death">Death</option>
          <option value="retirement">Retirement</option>
        </select>
        <select class="form-control" id="category-filter">
          <option value="">All Categories</option>
          <option value="senior_school">Senior School</option>
          <option value="junior_school">Junior School</option>
          <option value="tertiary_school">Tertiary School</option>
        </select>
        <select class="form-control" id="subcounty-filter">
          <option value="">All Sub-Counties</option>
          <option>Rongo</option><option>Awendo</option><option>Uriri</option><option>Suna East</option>
          <option>Suna West</option><option>Ntimaru</option><option>Kuria West</option><option>Kuria East</option>
          <option>Mabera</option><option>Nyatike South</option><option>Nyatike West</option><option>Nyatike North</option>
        </select>
        <select class="form-control" id="gender-filter">
          <option value="">All Genders</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
        <div style="display:flex;align-items:center;gap:.35rem">
          <span style="font-size:.8rem;color:var(--text-muted)">Submitted</span>
          <input type="date" class="form-control" id="date-from" aria-label="Submitted from" title="Submitted from (inclusive)">
          <span style="font-size:.8rem;color:var(--text-muted)">to</span>
          <input type="date" class="form-control" id="date-to" aria-label="Submitted to" title="Submitted to (inclusive)">
          <button id="date-clear" class="btn btn-outline btn-xs" title="Clear dates" type="button"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <div class="data-card">
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Claim No</th><th>Member</th><th>Type</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead>
            <tbody id="bbf-tbody"></tbody>
          </table>
        </div>
        <div id="bbf-pager"></div>
      </div>
    </div>
  </main>
</div>
<script src="/admin/js/admin-api.js?v=20260725g"></script><script src="/admin/js/admin-portal.js?v=20260725g"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getTopbarHtml('BBF Claims');
  const user = requireAdminAuth(); if(user) initSidebar(user);
  let currentStatus = new URLSearchParams(window.location.search).get('status') || '';
  let bbfOffset = 0; const BBF_LIMIT = 30;
  let currentCategory='', currentSubCounty='', currentGender='', currentSchool='';
  let currentType='', currentFrom='', currentTo='';
  const bbfFilters=()=>({status:currentStatus,claim_type:currentType,school_category:currentCategory,sub_county:currentSubCounty,gender:currentGender,school:currentSchool,date_from:currentFrom,date_to:currentTo});
  async function loadBbf() {
    const tbody = document.getElementById('bbf-tbody');
    tbody.innerHTML = '<tr><td colspan="6">'+renderLoading()+'</td></tr>';
    try {
      const res = await adminApi.bbf.getAll({...bbfFilters(),limit:BBF_LIMIT,offset:bbfOffset});
      const pager=()=>renderAdminPager('bbf-pager',{total:res.total||0,offset:bbfOffset,limit:BBF_LIMIT,onPage:o=>{bbfOffset=o;loadBbf();}});
      if(!res.data.length){tbody.innerHTML='<tr><td colspan="6">'+renderEmpty()+'</td></tr>';pager();return;}
      tbody.innerHTML = res.data.map(c=>`<tr>
        <td><strong>${escHtml(c.claim_number)}</strong></td>
        <td>${escHtml(c.full_name)}<br><small>${escHtml(c.member_number)}</small></td>
        <td>${escHtml(bbfTypeLabel(c.claim_type))}</td>
        <td>${statusBadge(c.status)}</td>
        <td>${formatDate(c.submitted_at)}</td>
        <td><a href="/admin/bbf-detail.html?id=${c.id}" class="btn btn-outline btn-xs"><i class="fas fa-eye"></i> Review</a></td>
      </tr>`).join('');
      pager();
    } catch(err){tbody.innerHTML='<tr><td colspan="7">'+escHtml(err.message)+'</td></tr>';}
  }
  document.querySelectorAll('#bbf-tabs .filter-tab').forEach(t=>{
    if(t.dataset.status===currentStatus) t.classList.add('active'); else t.classList.remove('active');
    t.addEventListener('click',()=>{
      document.querySelectorAll('#bbf-tabs .filter-tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');currentStatus=t.dataset.status;bbfOffset=0;loadBbf();
    });
  });
  let sst;document.getElementById('school-search').addEventListener('input',function(){clearTimeout(sst);sst=setTimeout(()=>{currentSchool=this.value;bbfOffset=0;loadBbf();},400);});
  document.getElementById('type-filter').addEventListener('change',function(){currentType=this.value;bbfOffset=0;loadBbf();});
  document.getElementById('category-filter').addEventListener('change',function(){currentCategory=this.value;bbfOffset=0;loadBbf();});
  document.getElementById('subcounty-filter').addEventListener('change',function(){currentSubCounty=this.value;bbfOffset=0;loadBbf();});
  document.getElementById('gender-filter').addEventListener('change',function(){currentGender=this.value;bbfOffset=0;loadBbf();});
  document.getElementById('date-from').addEventListener('change',function(){currentFrom=this.value;bbfOffset=0;loadBbf();});
  document.getElementById('date-to').addEventListener('change',function(){currentTo=this.value;bbfOffset=0;loadBbf();});
  document.getElementById('date-clear').addEventListener('click',function(){currentFrom='';currentTo='';document.getElementById('date-from').value='';document.getElementById('date-to').value='';bbfOffset=0;loadBbf();});
  // Export mirrors the active filters, not the whole table.
  document.getElementById('btn-export').addEventListener('click',function(){adminApi.bbf.exportExcel(bbfFilters()).catch(e=>alert(e.message));});
  loadBbf();
</script>
</body>
</html>
