<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=sessionStorage.getItem("adminToken"),la=parseInt(sessionStorage.getItem("adminLastActivity")||"0",10);if(!t||(la&&Date.now()-la>1800000)){sessionStorage.removeItem("adminToken");sessionStorage.removeItem("adminUser");sessionStorage.removeItem("adminLastActivity");location.replace("/admin/login.html");}})();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disciplinary Case — KUPPET Migori Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260723a"><link rel="stylesheet" href="/css/portal.css?v=20260723a">
</head>
<body class="portal-body admin-disciplinary-case-detail-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text">
          <h1 id="case-title" style="margin-bottom:0.25rem">Disciplinary Case</h1>
          <p><a href="/admin/disciplinary-cases.html"><i class="fas fa-arrow-left"></i> Back to Disciplinary Cases</a></p>
        </div>
        <span id="case-status"></span>
      </div>
      <div id="alert" class="hidden" style="margin-bottom:1rem"></div>

      <div class="grid-2" style="gap:1rem;align-items:start">
        <div class="data-card" style="padding:1.25rem">
          <div id="case-details"><div class="portal-loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div></div>
        </div>

        <div class="data-card" style="padding:1.25rem">
          <div class="data-card-title" style="margin-bottom:0.75rem">Updates &amp; Hearings</div>
          <form id="update-form" style="margin-bottom:1rem">
            <div id="update-alert" class="hidden"></div>
            <div class="form-row">
              <div class="form-group" style="max-width:170px"><label>Date</label><input type="date" name="update_date" class="form-control"></div>
            </div>
            <div class="form-group"><label>Note <span class="required">*</span></label><textarea name="note" class="form-control" rows="3" placeholder="e.g. Query letter served; response due in 21 days…"></textarea></div>
            <button type="button" class="btn btn-gold btn-sm" onclick="addUpdate()"><i class="fas fa-plus"></i> Add Update</button>
          </form>
          <div id="updates-list"></div>
        </div>
      </div>

      <!-- Documents -->
      <div class="data-card" style="padding:1.25rem;margin-top:1rem">
        <div class="data-card-title" style="margin-bottom:0.75rem">Documents</div>
        <form id="doc-form" style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem">
          <div id="doc-alert" class="hidden" style="flex-basis:100%"></div>
          <div class="form-group" style="margin-bottom:0;flex:1;min-width:180px"><label>Label (optional)</label><input type="text" id="doc-label" class="form-control" placeholder="e.g. Query Letter / Determination"></div>
          <div class="form-group" style="margin-bottom:0"><label>File</label><input type="file" id="doc-file" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png,.doc,.docx" style="display:block"></div>
          <button type="button" class="btn btn-gold btn-sm" onclick="uploadDoc()"><i class="fas fa-upload"></i> Upload</button>
        </form>
        <div id="docs-list"></div>
      </div>
    </div>
  </main>
</div>

<script src="/admin/js/admin-api.js?v=20260723a"></script><script src="/admin/js/admin-portal.js?v=20260723a"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getTopbarHtml('Disciplinary Case');
  const user = requireAdminAuth(); if(user) initSidebar(user);

  const id = new URLSearchParams(window.location.search).get('id');
  if(!id){ window.location.href = '/admin/disciplinary-cases.html'; }
  const OFFENCE_LABELS = {misconduct:'Misconduct',absenteeism:'Absenteeism',exam_irregularity:'Exam Irregularity',financial:'Financial',insubordination:'Insubordination',negligence:'Negligence',criminal:'Criminal',other:'Other'};
  const OUTCOME_LABELS = {pending:'Pending',warning:'Warning',suspension:'Suspension',dismissal:'Dismissal',reinstated:'Reinstated',cleared:'Cleared',other:'Other'};

  const section = (title, rows) => `
    <div style="margin-bottom:1.25rem">
      <div style="font-size:0.72rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted);border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:0.25rem;margin-bottom:0.75rem">${title}</div>
      <table style="width:100%;font-size:0.85rem;border-collapse:collapse">
        ${rows.map(([k,v])=>`<tr><td style="padding:0.4rem 0;color:var(--text-muted);width:42%">${k}</td><td>${v||'—'}</td></tr>`).join('')}
      </table>
    </div>`;

  async function load(){
    try{
      const res=await adminApi.disciplinaryCases.getOne(id);
      const c=res.data;
      document.getElementById('case-title').textContent=c.teacher_name;
      document.getElementById('case-status').innerHTML=statusBadge(c.status);

      const teacherRows=[
        ['TSC Number', escHtml(c.tsc_number||'—')],
        ['School', escHtml(c.school||'—')],
        ['Sub-county', escHtml(c.sub_county||'—')],
        ['Internal Ref.', escHtml(c.case_ref||'—')],
      ];
      const caseRows=[
        ['Offence', escHtml(OFFENCE_LABELS[c.offence_category]||c.offence_category||'—')],
        ['Stage', statusBadge(c.status)],
        ['Outcome / Sanction', escHtml(OUTCOME_LABELS[c.outcome]||c.outcome||'pending')],
        ['Responsible Officer', escHtml(c.officer_name||'—')],
        ['Created By', escHtml(c.created_by_name||'—')],
      ];
      const dateRows=[
        ['Reported', c.reported_date?formatDate(c.reported_date):'—'],
        ['Interdiction', c.interdiction_date?formatDate(c.interdiction_date):'—'],
        ['Hearing', c.hearing_date?formatDate(c.hearing_date):'—'],
        ['Resolved', c.resolved_date?formatDate(c.resolved_date):'—'],
      ];
      document.getElementById('case-details').innerHTML =
        section('Teacher', teacherRows) + section('Case', caseRows) + section('Key Dates', dateRows) +
        (c.description ? section('Allegation / Summary', [['', escHtml(c.description).replace(/\n/g,'<br>')]]) : '');

      renderUpdates(c.updates||[]);
      renderDocs(c.documents||[]);
    }catch(err){ showAlert('alert', err.message); }
  }

  function renderDocs(docs){
    const el=document.getElementById('docs-list');
    if(!docs.length){ el.innerHTML=`<p style="color:var(--text-muted);font-size:0.85rem">No documents attached yet.</p>`; return; }
    el.innerHTML=docs.map(d=>`
      <div style="display:flex;align-items:center;gap:0.6rem;padding:0.5rem 0;border-bottom:1px solid var(--border)">
        <i class="fas fa-file" style="color:var(--primary)"></i>
        <div style="flex:1;min-width:0">
          <div style="font-size:0.85rem;font-weight:600">${escHtml(d.label||d.file_name||'Document')}</div>
          <div style="font-size:0.72rem;color:var(--text-muted)">${escHtml(d.file_name||'')}${d.uploaded_by_name?` · ${escHtml(d.uploaded_by_name)}`:''} · ${formatDate(d.created_at)}</div>
        </div>
        <button type="button" class="btn btn-outline btn-xs" onclick="viewDoc('${escHtml(d.file_url)}')"><i class="fas fa-eye"></i> View</button>
        <button type="button" class="btn btn-xs" style="background:#FEE2E2;color:#991B1B" onclick="delDoc(${d.id})"><i class="fas fa-trash"></i></button>
      </div>`).join('');
  }

  async function uploadDoc(){
    const input=document.getElementById('doc-file');
    if(!input.files.length){ showAlert('doc-alert','Please choose a file'); return; }
    const form=new FormData();
    form.append('files', input.files[0]);
    form.append('label', document.getElementById('doc-label').value.trim());
    try{
      await adminApi.disciplinaryCases.uploadDocs(id, form);
      input.value=''; document.getElementById('doc-label').value='';
      document.getElementById('doc-alert').className='hidden';
      load();
    }catch(err){ showAlert('doc-alert', err.message); }
  }

  async function delDoc(docId){
    if(!confirm('Remove this document?'))return;
    try{ await adminApi.disciplinaryCases.removeDoc(id, docId); load(); }catch(err){ alert(err.message); }
  }

  function renderUpdates(updates){
    const el=document.getElementById('updates-list');
    if(!updates.length){ el.innerHTML=`<p style="color:var(--text-muted);font-size:0.85rem">No updates yet. Add the first milestone or hearing above.</p>`; return; }
    el.innerHTML = updates.map(u=>`
      <div style="border-left:3px solid var(--gold);padding:0.4rem 0 0.6rem 0.85rem;margin-bottom:0.6rem">
        <div style="font-size:0.75rem;color:var(--text-muted);font-weight:600">${formatDate(u.update_date)}${u.author_name?` · ${escHtml(u.author_name)}`:''}</div>
        <div style="font-size:0.85rem;white-space:pre-wrap">${escHtml(u.note)}</div>
      </div>`).join('');
  }

  async function addUpdate(){
    const form=document.getElementById('update-form');
    const note=form.querySelector('[name=note]').value.trim();
    const update_date=form.querySelector('[name=update_date]').value||null;
    if(!note){ showAlert('update-alert','Please enter an update note'); return; }
    try{
      await adminApi.disciplinaryCases.addUpdate(id,{note,update_date});
      form.reset();
      document.getElementById('update-alert').className='hidden';
      load();
    }catch(err){ showAlert('update-alert', err.message); }
  }

  load();
</script>
</body>
</html>
