<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs — KUPPET Migori Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260626b"><link rel="stylesheet" href="/css/portal.css?v=20260626b">
</head>
<body class="portal-body admin-audit-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1>Audit Logs</h1><p>Security and activity audit trail.</p></div>
        <button class="btn btn-outline btn-sm" onclick="adminApi.audit.exportPdf().catch(e=>alert(e.message))"><i class="fas fa-file-pdf"></i> Export PDF</button>
      </div>
      <div class="filter-bar">
        <input type="search" id="action-filter" class="form-control" placeholder="Filter by action...">
        <select id="type-filter" class="form-control">
          <option value="">All actors</option>
          <option value="admin">Admin</option>
          <option value="member">Member</option>
        </select>
        <input type="date" id="from-date" class="form-control">
        <input type="date" id="to-date" class="form-control">
        <button class="btn btn-outline btn-sm" onclick="loadLogs()"><i class="fas fa-search"></i></button>
      </div>
      <div class="data-card">
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Time</th><th>Actor</th><th>Type</th><th>Action</th><th>Resource</th><th>IP</th></tr></thead>
            <tbody id="audit-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/admin/js/admin-api.js"></script><script src="/admin/js/admin-portal.js"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getTopbarHtml('Audit Logs');
  const user = requireAdminAuth(); if(user) initSidebar(user);
  async function loadLogs(){
    const tbody=document.getElementById('audit-tbody');
    tbody.innerHTML='<tr><td colspan="6">'+renderLoading()+'</td></tr>';
    try{
      const res=await adminApi.audit.getAll({action:document.getElementById('action-filter').value,actor_type:document.getElementById('type-filter').value,from:document.getElementById('from-date').value,to:document.getElementById('to-date').value,limit:50});
      if(!res.data.length){tbody.innerHTML='<tr><td colspan="6">'+renderEmpty()+'</td></tr>';return;}
      tbody.innerHTML=res.data.map(r=>`<tr>
        <td style="white-space:nowrap;font-size:0.75rem">${formatDateTime(r.created_at)}</td>
        <td>${escHtml(r.actor_name||'Unknown')}</td>
        <td><span class="status-badge status-badge--${r.actor_type}">${r.actor_type}</span></td>
        <td><code style="font-size:0.75rem">${escHtml(r.action)}</code></td>
        <td>${escHtml(r.resource||'—')} ${r.resource_id?'#'+r.resource_id:''}</td>
        <td style="font-size:0.75rem">${escHtml(r.ip_address||'—')}</td>
      </tr>`).join('');
    }catch(err){tbody.innerHTML='<tr><td colspan="6">'+escHtml(err.message)+'</td></tr>';}
  }
  loadLogs();
</script>
</body>
</html>
