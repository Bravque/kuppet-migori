<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=sessionStorage.getItem("adminToken"),la=parseInt(sessionStorage.getItem("adminLastActivity")||"0",10);if(!t||(la&&Date.now()-la>1800000)){sessionStorage.removeItem("adminToken");sessionStorage.removeItem("adminUser");sessionStorage.removeItem("adminLastActivity");location.replace("/admin/login.html");}})();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarship Application — KUPPET Migori Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260804b"><link rel="stylesheet" href="/css/portal.css?v=20260804b">
</head>
<body class="portal-body admin-scholarship-app-detail-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1 id="app-number">Scholarship Application</h1><div id="app-status"></div></div>
        <div class="page-heading-actions">
          <a href="/admin/scholarship-apps.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back</a>
          <button type="button" id="print-btn" class="btn btn-outline btn-sm" disabled onclick="printApp()"><i class="fas fa-print"></i> Print</button>
        </div>
      </div>
      <div id="action-alert" class="hidden" style="margin-bottom:1rem"></div>
      <div id="action-buttons" style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem"></div>

      <div class="grid-2" style="gap:1rem">
        <div>
          <div class="data-card" style="margin-bottom:1rem">
            <div class="data-card-header"><div class="data-card-title">Application Details</div></div>
            <div style="padding:1.25rem" id="app-details"><div class="portal-loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div></div>
          </div>

          <div class="data-card" style="margin-bottom:1rem">
            <div class="data-card-header"><div class="data-card-title">Documents</div></div>
            <div style="padding:1.25rem"><ul class="doc-list" id="doc-list"></ul></div>
          </div>
        </div>

        <div>
          <!-- Legacy only: the form stopped collecting an essay in July 2026, so
               this card is revealed only for older applications that have one. -->
          <div class="data-card" id="essay-card" style="margin-bottom:1rem;display:none">
            <div class="data-card-header"><div class="data-card-title">Essay / Personal Statement</div></div>
            <div id="essay-box" style="padding:1.25rem;white-space:pre-wrap;font-size:0.875rem;line-height:1.7"></div>
          </div>
          <div class="data-card">
            <div class="data-card-header"><div class="data-card-title">Status Timeline</div></div>
            <div style="padding:1.25rem"><div class="timeline" id="timeline"></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Action modal (same shape as the BBF claim detail page) -->
<div class="portal-modal-overlay" id="action-modal">
  <div class="portal-modal" style="max-width:460px">
    <div class="portal-modal-header"><h3 id="action-modal-title">Action</h3><button class="modal-close-btn"><i class="fas fa-times"></i></button></div>
    <div class="portal-modal-body">
      <p id="action-modal-intro" style="font-size:0.85rem;color:var(--text-muted);margin-bottom:1rem"></p>
      <div class="form-group" id="amount-row" style="display:none">
        <label>Award amount (KES)</label>
        <input type="number" id="m-amount" class="form-control" min="0" step="0.01" placeholder="e.g. 20000 (optional)">
      </div>
      <div class="form-group" id="ref-row" style="display:none">
        <label>Payment reference</label>
        <input type="text" id="m-ref" class="form-control" placeholder="e.g. MPESA / cheque / voucher reference (optional)">
      </div>
      <div class="form-group" id="notes-row">
        <label id="notes-label">Notes (optional)</label>
        <textarea id="m-notes" class="form-control" rows="3"></textarea>
      </div>
    </div>
    <div class="portal-modal-footer">
      <button class="modal-close-btn btn btn-outline btn-sm">Cancel</button>
      <button id="action-confirm-btn" class="btn btn-gold btn-sm"><i class="fas fa-check"></i> Confirm</button>
    </div>
  </div>
</div>

<script src="/admin/js/admin-api.js?v=20260804b"></script><script src="/admin/js/admin-portal.js?v=20260804b"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getTopbarHtml('Scholarship Application');
  const user = requireAdminAuth(); if(user) initSidebar(user);
  // Approve/reject are branch_officer + super_admin decisions; branch_secretary may
  // view/print only (backend enforces). Hide the review-decision card for them.
  const canDecide = !!user && ['super_admin','branch_officer'].includes(user.role);
  const id = new URLSearchParams(window.location.search).get('id');
  if(!id){ window.location.href = '/admin/scholarship-apps.html'; }

  const DOC_LABELS = { letter_of_application:'Letter of Application', tsc_slip:'TSC Slip', kcse_certificate:'KCSE Certificate', kcse_cert:'KCSE Certificate', admission_letter:'Admission Letter', fee_structure:'Fee Structure', recommendation:'Recommendation', id_copy:'ID Copy', other:'Other' };
  let CURRENT = null;   // the loaded application, used by printApp()

  // True only for pre-July-2026 applications: the form no longer collects any of
  // these, so on a current application they are all null and the section would be
  // four em-dashes. Screen + print both gate on this.
  const hasStudyDetails = a => !!(a.institution || a.course || a.year_of_study || a.academic_year);

  // Print a clean, details-only record of the application (attachments are
  // viewed on-screen, not printed).
  function printApp(){
    const a = CURRENT; if(!a) return;
    const sections = [
      { title:'Application', rows:[
        ['Application No', escHtml(a.application_number)],
        ['Scholarship', escHtml(a.scholarship_title)],
        ['Status', escHtml((a.status||'').replace(/_/g,' '))],
        ...(a.amount_awarded != null && a.amount_awarded !== '' ? [['Amount Awarded', 'KES ' + Number(a.amount_awarded).toLocaleString()]] : []),
        ['Submitted', formatDate(a.created_at)],
        ['Reviewed', formatDate(a.reviewed_at)],
        ['Reviewer Notes', escHtml(a.reviewer_notes||'—')],
      ]},
      { title:"Applicant's Details", rows:[
        ['Name', escHtml(a.applicant_name||a.full_name||'—')],
        ['Member No', escHtml(a.member_number||'—')],
        ['TSC No', escHtml(a.tsc_number||'—')],
        ['Phone', escHtml(a.phone||'—')],
        ['Email', escHtml(a.email||'—')],
        ['Sub-County', escHtml(a.sub_county||'—')],
        ['School', escHtml(a.school_name||'—')],
        ['Category', escHtml(bbfSchoolCatLabel(a.school_category))],
      ]},
      ...(hasStudyDetails(a) ? [{ title:'Study Details', rows:[
        ['Institution', escHtml(a.institution||'—')],
        ['Course', escHtml(a.course||'—')],
        ['Year of Study', a.year_of_study ? escHtml(String(a.year_of_study)) : '—'],
        ['Academic Year', escHtml(a.academic_year||'—')],
      ]}] : []),
      ...(a.essay ? [{ title:'Essay / Personal Statement', rows:[
        ['Statement', escHtml(a.essay).replace(/\n/g,'<br>')],
      ]}] : []),
    ];
    printApplication({ heading:'Scholarship Application — '+(a.application_number||''), subheading:escHtml(a.scholarship_title||''), sections });
  }

  const section = (title, rows) => `
    <div style="margin-bottom:1.25rem">
      <div style="font-size:0.72rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted);border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:0.25rem;margin-bottom:0.75rem">${title}</div>
      <table style="width:100%;font-size:0.85rem;border-collapse:collapse">
        ${rows.map(([k,v])=>`<tr><td style="padding:0.4rem 0;color:var(--text-muted);width:42%">${k}</td><td>${v||'—'}</td></tr>`).join('')}
      </table>
    </div>`;

  async function load() {
    try {
      const res = await adminApi.schApps.getOne(id);
      const a = res.data;
      CURRENT = a;
      document.getElementById('print-btn').disabled = false;
      document.getElementById('app-number').textContent = a.application_number;
      document.getElementById('app-status').innerHTML = statusBadge(a.status);

      const appRows = [
        ['Application No', escHtml(a.application_number)],
        ['Scholarship', escHtml(a.scholarship_title)],
        ['Status', statusBadge(a.status)],
        ['Submitted', formatDate(a.created_at)],
        ['Reviewed', formatDate(a.reviewed_at)],
        ['Reviewer Notes', escHtml(a.reviewer_notes || '—')],
      ];
      if (a.amount_awarded != null && a.amount_awarded !== '') {
        appRows.splice(3, 0, ['Amount Awarded', `KES ${Number(a.amount_awarded).toLocaleString()}`]);
      }
      if (a.status === 'paid') {
        appRows.push(['Payment Ref', escHtml(a.payment_reference || '—')]);
        appRows.push(['Payment Date', formatDate(a.payment_date)]);
      }
      const applicantRows = [
        ['Name', escHtml(a.applicant_name || a.full_name || '—')],
        ['Member No', escHtml(a.member_number || '—')],
        ['TSC No', escHtml(a.tsc_number || '—')],
        ['Phone', a.phone ? `<a href="tel:${escHtml(a.phone)}">${escHtml(a.phone)}</a>` : '—'],
        ['Email', a.email ? `<a href="mailto:${escHtml(a.email)}">${escHtml(a.email)}</a>` : '—'],
        ['Sub-County', escHtml(a.sub_county || '—')],
        ['School', escHtml(a.school_name || '—')],
        ['Category', escHtml(bbfSchoolCatLabel(a.school_category))],
      ];
      // Study details are legacy — the form was simplified to the two required
      // uploads in July 2026, so these columns are null on every new application.
      // Show the section only for older applications that actually carry them.
      const studyRows = hasStudyDetails(a) ? [
        ['Institution', escHtml(a.institution || '—')],
        ['Course', escHtml(a.course || '—')],
        ['Year of Study', a.year_of_study ? escHtml(String(a.year_of_study)) : '—'],
        ['Academic Year', escHtml(a.academic_year || '—')],
      ] : null;
      document.getElementById('app-details').innerHTML =
        section('Application', appRows) + section("Applicant's Details", applicantRows) +
        (studyRows ? section('Study Details', studyRows) : '');

      if (a.essay) {
        document.getElementById('essay-card').style.display = '';
        document.getElementById('essay-box').innerHTML = escHtml(a.essay);
      }

      document.getElementById('doc-list').innerHTML = a.documents && a.documents.length
        ? a.documents.map(d=>`<li class="doc-item"><i class="fas fa-file doc-icon"></i><span class="doc-name">${escHtml(d.file_name||d.file_url)}</span><span class="doc-size">${escHtml(DOC_LABELS[d.doc_type]||d.doc_type||'')}</span><button type="button" data-view-doc="${escHtml(d.file_url)}" class="btn btn-outline btn-xs">View</button></li>`).join('')
        : '<li style="padding:0.5rem;color:var(--text-muted)">No documents</li>';

      // Action buttons based on status (mirrors bbf-detail.html). Start Review is
      // open to every admin role; approve/reject/mark-paid are decisions, so they
      // are shown only to branch_officer + super_admin (the backend enforces it).
      let bhtml = '';
      if (a.status === 'applied') bhtml = `<button id="act-review" class="btn btn-outline btn-sm"><i class="fas fa-search"></i> Start Review</button>`;
      if (canDecide && (a.status === 'applied' || a.status === 'under_review')) {
        bhtml += `<button id="act-approve" class="btn btn-sm" style="background:#DCFCE7;color:#166534"><i class="fas fa-check"></i> Approve</button><button id="act-reject" class="btn btn-sm" style="background:#FEE2E2;color:#991B1B"><i class="fas fa-times"></i> Reject</button>`;
      }
      if (canDecide && a.status === 'approved') bhtml = `<button id="act-paid" class="btn btn-gold btn-sm"><i class="fas fa-money-bill"></i> Mark as Paid</button>`;
      document.getElementById('action-buttons').innerHTML = bhtml;
      document.getElementById('act-review')?.addEventListener('click', () => openAction('review'));
      document.getElementById('act-approve')?.addEventListener('click', () => openAction('approve'));
      document.getElementById('act-reject')?.addEventListener('click', () => openAction('reject'));
      document.getElementById('act-paid')?.addEventListener('click', () => openAction('paid'));

      const tl = document.getElementById('timeline');
      tl.innerHTML = (a.timeline && a.timeline.length)
        ? a.timeline.map(e=>`<div class="timeline-item status-${e.to_status}"><div class="timeline-dot"><i class="fas fa-circle" style="font-size:0.45rem"></i></div><div class="timeline-content"><div class="timeline-status">${escHtml((e.to_status||'').replace(/_/g,' '))}</div><div class="timeline-meta">${formatDateTime(e.created_at)} by ${escHtml(e.changed_by_type)}</div>${e.comment?`<div class="timeline-comment">${escHtml(e.comment)}</div>`:''}</div></div>`).join('')
        : '<div style="color:var(--text-muted);font-size:0.85rem">No timeline entries yet.</div>';
    } catch (err) {
      showAlert('action-alert', err.message);
    }
  }

  // Every status change goes through one modal, so each action — Start Review
  // included — can carry a note that lands in the status timeline.
  const INTRO = {
    review:  'Move this application into review. You may add an internal note.',
    approve: 'Approve this application. Optionally set an award amount and a note for the member.',
    reject:  'Reject this application. Please give a reason — it is shared with the member.',
    paid:    'Mark this approved award as paid and record the payment reference.',
  };
  const TITLES = { review:'Start Review', approve:'Approve Application', reject:'Reject Application', paid:'Mark as Paid' };

  function openAction(action){
    const modal = document.getElementById('action-modal');
    document.getElementById('action-modal-title').textContent = TITLES[action];
    document.getElementById('action-modal-intro').textContent = INTRO[action];
    document.getElementById('amount-row').style.display = action==='approve' ? '' : 'none';
    document.getElementById('ref-row').style.display    = action==='paid'    ? '' : 'none';
    document.getElementById('notes-row').style.display  = action==='paid'    ? 'none' : '';
    document.getElementById('notes-label').textContent  = action==='reject' ? 'Reason for rejection' : 'Notes (optional)';
    document.getElementById('m-amount').value='';
    document.getElementById('m-ref').value='';
    document.getElementById('m-notes').value='';
    document.getElementById('action-confirm-btn').onclick = () => submitAction(action);
    modal.classList.add('open');
  }

  async function submitAction(action){
    const notes  = document.getElementById('m-notes').value.trim();
    const amount = document.getElementById('m-amount').value || null;
    const ref    = document.getElementById('m-ref').value.trim();
    if(action==='reject' && !notes){ showAlert('action-alert','A rejection reason is required.'); return; }
    const btn = document.getElementById('action-confirm-btn');
    btn.disabled = true;
    try {
      if(action==='review')  await adminApi.schApps.startReview(id, notes);
      if(action==='approve') await adminApi.schApps.approve(id, notes, amount);
      if(action==='reject')  await adminApi.schApps.reject(id, notes);
      if(action==='paid')    await adminApi.schApps.markPaid(id, ref || null);
      document.getElementById('action-modal').classList.remove('open');
      showAlert('action-alert','Action completed successfully','success');
      setTimeout(() => window.location.reload(), 1200);
    } catch(err){ showAlert('action-alert', err.message); btn.disabled = false; }
  }

  load();
</script>
</body>
</html>
