<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=sessionStorage.getItem("adminToken"),la=parseInt(sessionStorage.getItem("adminLastActivity")||"0",10);if(!t||(la&&Date.now()-la>1800000)){sessionStorage.removeItem("adminToken");sessionStorage.removeItem("adminUser");sessionStorage.removeItem("adminLastActivity");location.replace("/admin/login.html");}})();</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Court Cases — KUPPET Migori Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20260713b"><link rel="stylesheet" href="/css/portal.css?v=20260713b">
</head>
<body class="portal-body admin-court-cases-page">
<div class="portal-layout">
  <div id="sidebar-placeholder"></div>
  <main class="portal-main">
    <div id="topbar-placeholder"></div>
    <div class="portal-content">
      <div class="page-heading">
        <div class="page-heading-text"><h1>Court Cases</h1><p>Track the branch's court matters, hearings and outcomes.</p></div>
        <button class="btn btn-gold btn-sm" onclick="openCaseModal(null)"><i class="fas fa-plus"></i> New Case</button>
      </div>
      <div id="alert" class="hidden" style="margin-bottom:1rem"></div>
      <div class="filter-tabs" id="status-tabs">
        <button class="filter-tab active" data-status="">All</button>
        <button class="filter-tab" data-status="open">Open</button>
        <button class="filter-tab" data-status="ongoing">Ongoing</button>
        <button class="filter-tab" data-status="on_hold">On Hold</button>
        <button class="filter-tab" data-status="closed">Closed</button>
      </div>
      <div class="filter-bar">
        <input type="search" class="form-control" id="case-search" placeholder="Search title, case no, parties…">
        <select class="form-control" id="type-filter">
          <option value="">All Types</option>
          <option value="employment">Employment</option>
          <option value="disciplinary">Disciplinary</option>
          <option value="criminal">Criminal</option>
          <option value="civil">Civil</option>
          <option value="constitutional">Constitutional</option>
          <option value="appeal">Appeal</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="data-card">
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Case</th><th>Court</th><th>Type</th><th>Parties</th><th>Status</th><th>Next Hearing</th><th>Officer</th><th>Actions</th></tr></thead>
            <tbody id="cases-tbody"><tr><td colspan="8" class="portal-loading"><i class="fas fa-spinner fa-spin"></i> Loading…</td></tr></tbody>
          </table>
        </div>
        <div id="cases-pager"></div>
      </div>
    </div>
  </main>
</div>

<!-- Create / edit modal -->
<div class="portal-modal-overlay" id="case-modal">
  <div class="portal-modal" style="max-width:640px">
    <div class="portal-modal-header"><h3 id="case-modal-title">New Court Case</h3><button class="modal-close-btn"><i class="fas fa-times"></i></button></div>
    <div class="portal-modal-body">
      <div id="case-form-alert" class="hidden"></div>
      <form id="case-form">
        <div class="form-group"><label>Case Title <span class="required">*</span></label><input type="text" name="title" class="form-control" required placeholder="e.g. TSC vs. Migori Teacher (unfair transfer)"></div>
        <div class="form-row">
          <div class="form-group"><label>Court Case No.</label><input type="text" name="case_number" class="form-control" placeholder="e.g. ELRC 123 of 2026"></div>
          <div class="form-group"><label>Court / Station</label><input type="text" name="court" class="form-control" placeholder="e.g. ELRC Kisumu"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Type</label>
            <select name="case_type" class="form-control">
              <option value="employment">Employment</option>
              <option value="disciplinary">Disciplinary</option>
              <option value="criminal">Criminal</option>
              <option value="civil">Civil</option>
              <option value="constitutional">Constitutional</option>
              <option value="appeal">Appeal</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group"><label>Status</label>
            <select name="status" class="form-control">
              <option value="open">Open</option>
              <option value="ongoing">Ongoing</option>
              <option value="on_hold">On Hold</option>
              <option value="closed">Closed</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Claimant / Petitioner</label><input type="text" name="plaintiff" class="form-control"></div>
          <div class="form-group"><label>Respondent</label><input type="text" name="defendant" class="form-control"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Filing Date</label><input type="date" name="filing_date" class="form-control"></div>
          <div class="form-group"><label>Next Hearing</label><input type="date" name="next_hearing_date" class="form-control"></div>
        </div>
        <div class="form-group" id="outcome-group"><label>Outcome (if closed)</label>
          <select name="outcome" class="form-control">
            <option value="pending">Pending</option>
            <option value="won">Won</option>
            <option value="lost">Lost</option>
            <option value="settled">Settled</option>
            <option value="withdrawn">Withdrawn</option>
            <option value="dismissed">Dismissed</option>
          </select>
        </div>
        <div class="form-group"><label>Description / Summary</label><textarea name="description" class="form-control" rows="4"></textarea></div>
      </form>
    </div>
    <div class="portal-modal-footer">
      <button class="btn btn-outline btn-sm modal-close-btn">Cancel</button>
      <button class="btn btn-gold btn-sm" onclick="saveCase()"><i class="fas fa-save"></i> Save Case</button>
    </div>
  </div>
</div>

<script src="/admin/js/admin-api.js"></script><script src="/admin/js/admin-portal.js"></script>
<script>
  document.getElementById('sidebar-placeholder').outerHTML = getSidebarHtml();
  document.getElementById('topbar-placeholder').outerHTML = getTopbarHtml('Court Cases');
  const user = requireAdminAuth(); if(user) initSidebar(user);

  const CASE_TYPE_LABELS = {employment:'Employment',disciplinary:'Disciplinary',criminal:'Criminal',civil:'Civil',constitutional:'Constitutional',appeal:'Appeal',other:'Other'};
  let editingCaseId=null, currentStatus='', currentType='', currentSearch='', caseOffset=0;
  const CASE_LIMIT=25;
  const f = sel => document.getElementById('case-form').querySelector(`[name=${sel}]`);

  async function loadCases(){
    const tb=document.getElementById('cases-tbody');
    tb.innerHTML='<tr><td colspan="8">'+renderLoading()+'</td></tr>';
    try{
      const res=await adminApi.courtCases.getAll({status:currentStatus,case_type:currentType,search:currentSearch,limit:CASE_LIMIT,offset:caseOffset});
      const pager=()=>renderAdminPager('cases-pager',{total:res.total||0,offset:caseOffset,limit:CASE_LIMIT,onPage:o=>{caseOffset=o;loadCases();}});
      if(!res.data.length){tb.innerHTML='<tr><td colspan="8">'+renderEmpty('No court cases yet')+'</td></tr>';pager();return;}
      tb.innerHTML=res.data.map(c=>`<tr>
        <td><strong>${escHtml(c.title)}</strong>${c.case_number?`<br><small>${escHtml(c.case_number)}</small>`:''}</td>
        <td>${escHtml(c.court||'—')}</td>
        <td>${escHtml(CASE_TYPE_LABELS[c.case_type]||c.case_type||'—')}</td>
        <td style="font-size:0.8rem">${escHtml(c.plaintiff||'—')} <span style="color:var(--text-muted)">v.</span> ${escHtml(c.defendant||'—')}</td>
        <td>${statusBadge(c.status)}${c.status==='closed'&&c.outcome&&c.outcome!=='pending'?`<br><small>${escHtml(c.outcome)}</small>`:''}</td>
        <td>${c.next_hearing_date?formatDate(c.next_hearing_date):'—'}</td>
        <td style="font-size:0.8rem">${escHtml(c.officer_name||'—')}</td>
        <td style="display:flex;gap:0.3rem;flex-wrap:wrap">
          <a href="/admin/court-case-detail.html?id=${c.id}" class="btn btn-outline btn-xs" title="Open"><i class="fas fa-eye"></i></a>
          <button class="btn btn-outline btn-xs" title="Edit" onclick='editCase(${JSON.stringify(c).replace(/'/g,"&#39;")})'><i class="fas fa-edit"></i></button>
          <button class="btn btn-xs" style="background:#FEE2E2;color:#991B1B" title="Delete" onclick="delCase(${c.id})"><i class="fas fa-trash"></i></button>
        </td>
      </tr>`).join('');
      pager();
    }catch(err){tb.innerHTML='<tr><td colspan="8">'+escHtml(err.message)+'</td></tr>';}
  }

  function openCaseModal(){
    editingCaseId=null;
    document.getElementById('case-form').reset();
    document.getElementById('case-modal-title').textContent='New Court Case';
    document.getElementById('case-form-alert').className='hidden';
    document.getElementById('case-modal').classList.add('open');
  }
  function editCase(c){
    editingCaseId=c.id;
    document.getElementById('case-form').reset();
    ['title','case_number','court','case_type','status','plaintiff','defendant','outcome','description'].forEach(k=>{ if(f(k)) f(k).value=c[k]||''; });
    f('filing_date').value = c.filing_date ? c.filing_date.substring(0,10) : '';
    f('next_hearing_date').value = c.next_hearing_date ? c.next_hearing_date.substring(0,10) : '';
    document.getElementById('case-modal-title').textContent='Edit Court Case';
    document.getElementById('case-form-alert').className='hidden';
    document.getElementById('case-modal').classList.add('open');
  }
  async function saveCase(){
    if(!f('title').value.trim()){showAlert('case-form-alert','Case title is required');return;}
    const payload={
      title:f('title').value.trim(), case_number:f('case_number').value.trim(), court:f('court').value.trim(),
      case_type:f('case_type').value, status:f('status').value, outcome:f('outcome').value,
      plaintiff:f('plaintiff').value.trim(), defendant:f('defendant').value.trim(),
      filing_date:f('filing_date').value||null, next_hearing_date:f('next_hearing_date').value||null,
      description:f('description').value.trim(),
    };
    try{
      editingCaseId ? await adminApi.courtCases.update(editingCaseId,payload) : await adminApi.courtCases.create(payload);
      document.getElementById('case-modal').classList.remove('open');
      loadCases();
    }catch(err){showAlert('case-form-alert',err.message);}
  }
  async function delCase(id){
    if(!confirm('Delete this court case and its updates? This cannot be undone.'))return;
    try{await adminApi.courtCases.remove(id);loadCases();}catch(e){alert(e.message);}
  }

  document.querySelectorAll('.modal-close-btn').forEach(b=>b.addEventListener('click',()=>document.getElementById('case-modal').classList.remove('open')));
  document.querySelectorAll('#status-tabs .filter-tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('#status-tabs .filter-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');currentStatus=t.dataset.status;caseOffset=0;loadCases();
  }));
  document.getElementById('type-filter').addEventListener('change',function(){currentType=this.value;caseOffset=0;loadCases();});
  let st;document.getElementById('case-search').addEventListener('input',function(){clearTimeout(st);st=setTimeout(()=>{currentSearch=this.value;caseOffset=0;loadCases();},400);});
  loadCases();
</script>
</body>
</html>
